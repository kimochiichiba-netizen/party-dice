<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="プロの解説つきで学べるリーチ麻雀。CPU対戦と、合言葉で友だちとオンライン対戦。ログイン不要。">
<meta name="theme-color" content="#09332a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'%3E%3Crect x='1' y='1' width='28' height='38' rx='4' fill='%23fffaf0' stroke='%23c96f2a' stroke-width='2'/%3E%3Ctext x='15' y='29' font-size='22' text-anchor='middle' fill='%23b0262f' font-weight='bold'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
<title>麻雀道場 プロの目</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: felt table (left) + coach notebook (right); stacks on phones. Single committed look: a lamp-lit mahjong table. */
:root{
  --felt:#0e4639; --felt-deep:#09332a; --felt-line:#1f6e58;
  --ivory:#f5f0e2; --ivory-edge:#d6caa9; --back:#c96f2a; --back-deep:#8e4a17;
  --ink:#1c1b18; --man:#b0262f; --pin:#1d4c9c; --sou:#17703f;
  --gold:#e9b949; --panel:#10231e; --panel-2:#16302a; --line:#2a4a41;
  --text:#e8efe9; --muted:#9db6ab; --safe:#4cc38a; --warn:#e9b949; --danger:#f0605a;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-tile:"Shippori Mincho B1","Hiragino Mincho ProN","Noto Serif JP",serif;
  --f-pop:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Zen Kaku Gothic New",sans-serif;
  --w:30px;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--felt-deep);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:8px}
@media (max-width:1300px){header h1 small{display:none}}
header h1{font-family:var(--f-tile);font-size:20px;margin:0;letter-spacing:.06em;font-weight:800}
header h1 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:0}
header .sp{flex:1}
@media (max-width:640px){header{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:8px} header::-webkit-scrollbar{display:none} header h1{white-space:nowrap;font-size:17px} header h1 small{display:none} header .btn,header .net{white-space:nowrap;flex:none}}
.btn{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#2a1d00;border-color:var(--gold);font-weight:700}
.btn.danger{background:#7a2321;border-color:var(--danger)}
.btn.win{background:var(--danger);border-color:#ff9a8a;color:#fff;font-weight:700;font-size:15px}
.btn[disabled]{opacity:.4;cursor:default}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding-bottom:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
body{background:radial-gradient(ellipse at 50% 0%,#123a31 0%,#071a15 60%,#04110d 100%) var(--felt-deep);min-height:100%}

/* ---------- stage: square table seen from above ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.board{position:relative;width:min(100%,max(320px,calc(100dvh - 330px)));aspect-ratio:1;container-type:size;border-radius:2.6cqw;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 22%,transparent 60%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px),
    radial-gradient(circle at 50% 50%,#1d7a60 0%,#145a47 48%,#0b3a2f 100%);
  box-shadow:inset 0 0 0 .5cqw #6b4a24,inset 0 0 0 1.1cqw #3b2611,inset 0 0 6cqw rgba(0,0,0,.55),0 2.5cqw 5cqw rgba(0,0,0,.55)}
.side{position:absolute;inset:0;pointer-events:none}
.side.r1{transform:rotate(-90deg)} .side.r2{transform:rotate(180deg)} .side.r3{transform:rotate(90deg)}
.side .pond{position:absolute;left:34.6cqw;top:66.2cqw;width:31cqw;display:grid;grid-template-columns:repeat(6,4.95cqw);gap:.45cqw .22cqw;--w:4.75cqw}
.side .backs{position:absolute;left:24cqw;top:93.2cqw;display:flex;gap:.1cqw;--w:3.35cqw}
.side .melds{position:absolute;right:26cqw;top:92.4cqw;display:flex;flex-direction:row-reverse;gap:.9cqw;--w:3.6cqw}
.board-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10cqw;color:var(--muted);font-size:max(14px,2.8cqw);z-index:4}

/* compass in the middle */
.compass{position:absolute;left:34.6cqw;top:34.6cqw;width:30.8cqw;height:30.8cqw;border-radius:2.6cqw;
  background:linear-gradient(145deg,#12302a,#06140f);box-shadow:inset 0 0 0 .35cqw #2f6152,inset 0 0 3cqw rgba(0,0,0,.6),0 1.2cqw 2.5cqw rgba(0,0,0,.55)}
#compassIn{position:absolute;inset:0}
.cs{position:absolute;inset:0}
.cs.r1{transform:rotate(-90deg)} .cs.r2{transform:rotate(180deg)} .cs.r3{transform:rotate(90deg)}
.cs .lab{position:absolute;left:0;right:0;bottom:1.6cqw;display:flex;justify-content:center;align-items:center;gap:.8cqw;font-size:2.4cqw;font-variant-numeric:tabular-nums;color:#cfe3da}
.cs .w{font-family:var(--f-tile);font-size:2.8cqw;color:#e9efe9}
.cs .w.dealer{color:#ff7a6e}
.cs .bar{position:absolute;left:20%;right:20%;bottom:.55cqw;height:.55cqw;border-radius:1cqw;background:rgba(255,255,255,.08)}
.cs.on .bar{background:var(--gold);box-shadow:0 0 1.6cqw var(--gold);animation:glow 1.1s ease-in-out infinite alternate}
.cs.on .lab{color:var(--gold)}
.cs .stick{position:absolute;left:33%;right:33%;bottom:5.4cqw;height:.9cqw;border-radius:.5cqw;background:#f4f1e6;box-shadow:0 .2cqw .4cqw rgba(0,0,0,.5)}
.cs .stick::after{content:"";position:absolute;left:50%;top:50%;width:.7cqw;height:.7cqw;border-radius:50%;background:#c8323a;transform:translate(-50%,-50%)}
.cc{position:absolute;inset:6.6cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqw;text-align:center}
.cc .rd{font-family:var(--f-tile);font-weight:800;font-size:3.6cqw;letter-spacing:.12em;color:#f3ecd8}
.cc .mt{font-size:1.8cqw;color:var(--muted)}
.cc .wall{font-size:1.9cqw;color:var(--muted)} .cc .wall b{color:#f3ecd8;font-size:2.6cqw;margin-left:.4cqw;font-variant-numeric:tabular-nums}
.cc .dora{display:flex;gap:.25cqw;--w:2.7cqw;margin-top:.4cqw}
.ring{position:absolute;inset:-.8cqw;border-radius:3.2cqw;padding:.55cqw;pointer-events:none;
  background:conic-gradient(var(--gold) calc(var(--p,1)*1turn),rgba(255,255,255,.06) 0);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ring.low{background:conic-gradient(var(--danger) calc(var(--p,1)*1turn),rgba(255,255,255,.06) 0)}

/* name plates */
.plate{position:absolute;z-index:3;width:max(23cqw,112px);padding:.9cqw 1.3cqw;border-radius:1.6cqw;background:rgba(4,18,14,.78);border:1px solid rgba(255,255,255,.12);
  font-size:max(10px,2.15cqw);line-height:1.3;display:grid;gap:.2cqw;transition:box-shadow .25s}
.plate.r0{left:1.4cqw;bottom:1.4cqw} .plate.r1{right:1.4cqw;bottom:1.4cqw} .plate.r2{right:1.4cqw;top:1.4cqw} .plate.r3{left:1.4cqw;top:1.4cqw}
.plate.turn{box-shadow:0 0 0 .35cqw var(--gold),0 0 2.4cqw rgba(233,185,73,.55)}
.plate .pl-top,.plate .pl-bot{display:flex;align-items:center;gap:.8cqw;min-width:0}
.plate .w{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:.3em;background:var(--ivory);color:var(--ink);font-family:var(--f-tile);flex:none}
.plate .w.dealer{background:var(--danger);color:#fff}
.plate .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.plate .pt{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.plate .tg{font-size:.82em;color:var(--muted);white-space:nowrap}
.plate .rb{font-size:.82em;font-weight:700;color:#fff;background:var(--danger);border-radius:.3em;padding:0 .4em}
.plate .think{position:absolute;right:1cqw;top:-1.2cqw;display:flex;gap:.4cqw;background:var(--gold);border-radius:1cqw;padding:.5cqw .8cqw}
.plate .think i{width:.8cqw;height:.8cqw;border-radius:50%;background:#2a1d00;animation:think 1s infinite}
.plate .think i:nth-child(2){animation-delay:.15s} .plate .think i:nth-child(3){animation-delay:.3s}
.plate .delta{position:absolute;left:50%;top:-.5cqw;transform:translateX(-50%);font-family:var(--f-tile);font-weight:800;font-size:max(13px,3.2cqw);white-space:nowrap;animation:floatUp 2.8s ease-out forwards;text-shadow:0 .3cqw .6cqw rgba(0,0,0,.8)}
.plate .delta.up{color:#7ff0b4} .plate .delta.down{color:#ff8b84}

/* ---------- tiles ---------- */
.tile{position:relative;display:inline-block;width:var(--w);height:calc(var(--w)*1.36);flex:none;
  background:linear-gradient(180deg,#fffef8 0%,#f7f1e1 70%,#e8dcc0 100%);border-radius:calc(var(--w)*.13);
  box-shadow:0 calc(var(--w)*.07) 0 #cdbb8f,0 calc(var(--w)*.12) 0 var(--back),0 calc(var(--w)*.18) calc(var(--w)*.18) rgba(0,0,0,.35);
  margin-bottom:calc(var(--w)*.12);color:var(--ink);font-family:var(--f-tile);font-weight:800;line-height:1;user-select:none;-webkit-user-select:none}
.tile svg{position:absolute;left:9%;top:7%;width:82%;height:86%}
.tile b{position:absolute;left:0;right:0;text-align:center;font-weight:800}
.tile i{position:absolute;left:0;right:0;text-align:center;font-style:normal}
.tile.m b{top:8%;font-size:calc(var(--w)*.56)} .tile.m i{bottom:7%;font-size:calc(var(--w)*.5);color:var(--man)}
.tile.z b{top:50%;transform:translateY(-50%);font-size:calc(var(--w)*.7);color:#1e2a4a}
.tile.hatsu b{color:var(--sou)} .tile.chun b{color:var(--man)}
.tile.haku::after{content:"";position:absolute;inset:20% 19%;border:calc(var(--w)*.065) solid #5b7fc4;border-radius:calc(var(--w)*.06)}
.tile .ix{display:none;position:absolute;left:5%;top:2%;font:700 calc(var(--w)*.24) var(--f-body);font-style:normal;color:#5b5446;line-height:1}
body.guide .tile .ix{display:block}
body.guide .tile.p svg,body.guide .tile.s svg{left:14%;top:9%;width:78%;height:84%}
.tile.back{background:linear-gradient(160deg,#f09a52,var(--back) 60%,#a9561c);box-shadow:inset 0 0 0 calc(var(--w)*.06) rgba(255,255,255,.18),0 calc(var(--w)*.1) 0 #f2ead6,0 calc(var(--w)*.16) calc(var(--w)*.16) rgba(0,0,0,.35)}
.tile.dim{opacity:.35}
.tile.side{transform:rotate(-90deg) scale(.9)}
.tile.win{box-shadow:0 0 0 calc(var(--w)*.08) var(--danger),0 calc(var(--w)*.12) 0 var(--back)}
.tile.dora-mark::before{content:"";position:absolute;top:5%;right:6%;width:calc(var(--w)*.16);height:calc(var(--w)*.16);border-radius:50%;background:var(--danger);box-shadow:0 0 calc(var(--w)*.15) var(--danger);z-index:1}
.pond .tile.last::before{content:"";position:absolute;left:50%;top:calc(var(--w)*-.5);border:calc(var(--w)*.2) solid transparent;border-top-color:var(--gold);transform:translateX(-50%);animation:bob .8s ease-in-out infinite alternate}
.pond .tile.fresh{animation:toss .34s cubic-bezier(.2,.9,.3,1.15)}
.pond .tile.side.fresh{animation:tossSide .34s cubic-bezier(.2,.9,.3,1.15)}

/* ---------- my tray ---------- */
.tray{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--hw,40px)*.4);padding:0 2px 8px;--hw:40px}
.tray .melds{display:flex;gap:calc(var(--hw)*.15);flex:none;--w:calc(var(--hw)*.74);padding-bottom:calc(var(--hw)*.1)}
.tray .melds:empty{display:none}
.meld{display:flex;gap:1px;align-items:flex-end}
.hand{display:flex;gap:min(4px,.4cqw);align-items:flex-end;justify-content:center;padding-top:26px;--w:var(--hw);min-height:calc(var(--w)*1.36 + 36px);perspective:600px;min-width:0}
.hand .gap{width:calc(var(--w)*.35);flex:none}
.hand .tile{box-shadow:0 calc(var(--w)*.06) 0 #cdbb8f,0 calc(var(--w)*.2) 0 var(--back),0 calc(var(--w)*.24) 0 #8e4a17,0 calc(var(--w)*.3) calc(var(--w)*.3) rgba(0,0,0,.45);
  margin-bottom:calc(var(--w)*.24);transition:transform .14s cubic-bezier(.2,.9,.3,1.2),filter .15s}
.hand.active .tile.can{cursor:pointer}
.hand.active .tile.can:hover{transform:translateY(-6px)}
.hand .tile.sel{transform:translateY(-16px)!important;box-shadow:0 0 0 2px var(--gold),0 calc(var(--w)*.2) 0 var(--back),0 10px 22px rgba(233,185,73,.45)}
.hand .tile.no{filter:grayscale(.75) brightness(.6)}
.hand.riichi-mode .tile.can{box-shadow:0 0 0 2px #ffb347,0 calc(var(--w)*.2) 0 var(--back),0 0 14px rgba(255,179,71,.6)}
.hand .tile.rec::after{content:"推奨";position:absolute;top:-21px;left:50%;transform:translateX(-50%);font:700 10px var(--f-body);color:#2a1d00;background:var(--gold);padding:1px 5px;border-radius:4px;white-space:nowrap;animation:bob .9s ease-in-out infinite alternate}
.hand .tile.haku.rec::after{inset:auto;border:0}
.hand .tile .dg{position:absolute;bottom:calc(var(--w)*-.42);left:15%;right:15%;height:4px;border-radius:2px}
.dg.l0{background:var(--safe)} .dg.l1{background:#9bd17a} .dg.l2{background:var(--warn)} .dg.l3{background:var(--danger)}
.hand .tile.deal{animation:dealIn .42s cubic-bezier(.2,.9,.3,1.2) both}
.hand .tile.drawn{animation:drawIn .3s ease-out}

/* ---------- action pills ---------- */
.actions{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:30px}
.pills{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{position:relative;font:800 18px var(--f-tile);letter-spacing:.08em;color:#fff;border:0;border-radius:999px;padding:9px 22px;display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#4b8be0,#1f4f9c);box-shadow:0 4px 0 #13325f,0 8px 18px rgba(0,0,0,.4);animation:pillIn .28s cubic-bezier(.2,.9,.3,1.3) both;transition:transform .08s}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #13325f}
.pill small{font:700 12px var(--f-body);opacity:.85}
.pill .mini{display:flex;gap:1px;--w:15px}
.pill .mini .tile{margin-bottom:2px}
.pill.win{background:linear-gradient(180deg,#ff7a63,#c0272d);box-shadow:0 4px 0 #6e1014,0 0 22px rgba(255,90,70,.55);animation:pillIn .28s both,pulse 1s .3s ease-in-out infinite}
.pill.riichi{background:linear-gradient(180deg,#ffbd59,#dd7400);box-shadow:0 4px 0 #7a3c00,0 8px 18px rgba(0,0,0,.4)}
.pill.riichi.on{background:linear-gradient(180deg,#8a8a8a,#5c5c5c);box-shadow:0 4px 0 #333}
.pill.kan{background:linear-gradient(180deg,#a77be6,#6638b0);box-shadow:0 4px 0 #3a1b6e,0 8px 18px rgba(0,0,0,.4)}
.pill.pass{background:linear-gradient(180deg,#6f7f79,#45524d);box-shadow:0 4px 0 #262e2b,0 8px 18px rgba(0,0,0,.4)}
.pill.rec::after{content:"推奨";position:absolute;top:-10px;right:-6px;font:700 10px var(--f-body);color:#2a1d00;background:var(--gold);border-radius:4px;padding:1px 5px;letter-spacing:0}
.hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;text-align:center;font-size:13px;color:#d8e6df;max-width:100%}
.hint.dim{color:var(--muted)}
.hint .tile{--w:18px;vertical-align:middle;margin-bottom:2px}
.hint .pro{font:700 11px var(--f-body);color:#2a1d00;background:var(--gold);border-radius:4px;padding:1px 6px;margin-right:2px}
.hint strong{color:var(--gold)}
.tleft{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.tleft:empty{display:none}
.tleft.low{color:#fff;background:var(--danger);border-color:var(--danger)}

/* ---------- effects layer ---------- */
.fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.callout{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-tile);font-weight:800;font-size:9cqw;letter-spacing:.12em;white-space:nowrap;color:#fff;
  text-shadow:0 0 2cqw rgba(110,180,255,.95),0 .5cqw 0 #13325f;-webkit-text-stroke:.22cqw #0d2a55;animation:callout 1.5s cubic-bezier(.2,.9,.3,1) forwards}
.callout::before{content:"";position:absolute;left:50%;top:50%;width:30cqw;height:30cqw;border-radius:50%;transform:translate(-50%,-50%) scale(.2);
  border:.6cqw solid currentColor;opacity:.7;animation:burst .7s ease-out forwards;z-index:-1}
.callout.r0{left:50%;top:76%} .callout.r1{left:78%;top:50%} .callout.r2{left:50%;top:24%} .callout.r3{left:22%;top:50%}
.callout.riichi{color:#ffe0b0;text-shadow:0 0 2cqw rgba(255,160,40,.95),0 .5cqw 0 #6b3300;-webkit-text-stroke:.22cqw #6b3300}
.callout.big{font-size:17cqw;left:50%!important;top:50%!important;color:#fff3c4;text-shadow:0 0 3cqw rgba(255,80,60,.95),0 .8cqw 0 #6e1014;-webkit-text-stroke:.3cqw #6e1014}
.banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);padding:2.6cqw 0;text-align:center;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.82) 18%,rgba(0,0,0,.82) 82%,transparent);animation:banner 1.9s ease-in-out forwards}
.banner b{display:block;font-family:var(--f-tile);font-size:7.5cqw;letter-spacing:.25em;color:var(--gold);text-shadow:0 0 2cqw rgba(233,185,73,.5)}
.banner span{font-size:max(12px,2.4cqw);color:#e8efe9}

/* result sheet motion */
.sheet{animation:sheetIn .32s cubic-bezier(.2,.9,.3,1.1)}
table.yaku tr.yrow{animation:rowIn .35s both}
.stamp{display:inline-block;font-family:var(--f-tile);font-weight:800;color:#fff;background:var(--danger);border-radius:6px;padding:2px 10px;margin-left:8px;transform:rotate(-6deg);animation:stamp .45s both}

@keyframes toss{from{transform:translateY(24cqw) scale(1.5) rotate(-8deg);opacity:0}55%{opacity:1}to{transform:none}}
@keyframes tossSide{from{transform:translateY(24cqw) rotate(-60deg) scale(1.4);opacity:0}to{transform:rotate(-90deg) scale(.9)}}
@keyframes dealIn{from{transform:translateY(-46px) rotateX(75deg);opacity:0}to{transform:none;opacity:1}}
@keyframes drawIn{from{transform:translate(26px,-34px) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pillIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-4px)}}
@keyframes think{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-3cqw)}}
@keyframes callout{0%{transform:translate(-50%,-50%) scale(2.6);opacity:0}14%{transform:translate(-50%,-50%) scale(.9);opacity:1}24%{transform:translate(-50%,-50%) scale(1.06)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
@keyframes burst{to{transform:translate(-50%,-50%) scale(1.3);opacity:0}}
@keyframes banner{0%{clip-path:inset(0 50% 0 50%);opacity:0}14%{clip-path:inset(0 0 0 0);opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes sheetIn{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes rowIn{from{transform:translateX(-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes stamp{0%{transform:rotate(-6deg) scale(2.2);opacity:0}70%{transform:rotate(-6deg) scale(.92);opacity:1}100%{transform:rotate(-6deg) scale(1)}}

body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* app bar */
.appbar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;padding-block:8px;min-width:0}
.appbar h1{font-family:var(--f-tile);font-size:20px;margin:0;letter-spacing:.06em;font-weight:800;white-space:nowrap}
.appbar h1 span{font-size:.62em;color:var(--gold);margin-left:.5em;letter-spacing:.1em}
.ib{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--text);border:1px solid transparent;border-radius:10px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.ib:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.ib svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--gold)}
.ib.off svg{opacity:.5}
@media (max-width:640px){.appbar .ib .lbl{display:none}.appbar h1{font-size:17px}.appbar h1 span{display:none}}
/* drawer */
.drawer{position:fixed;inset:0;z-index:70;background:rgba(3,12,10,0);transition:background .18s}
.drawer.open{background:rgba(3,12,10,.6)}
.drawer-panel{position:absolute;right:0;top:0;bottom:0;width:min(330px,88vw);background:var(--panel);border-left:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;transform:translateX(100%);transition:transform .18s ease-out}
.drawer.open .drawer-panel{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;font-family:var(--f-tile);font-size:18px}
.dl{text-align:left;background:transparent;color:var(--text);border:0;border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.dl:hover,.dl:focus-visible{background:var(--panel-2)}
.dl b{font-size:14.5px} .dl span{font-size:12px;color:var(--muted)}
.dl.sep{margin-top:6px;border-top:1px solid var(--line);border-radius:0;padding-top:14px}
/* home */
.home{display:grid;gap:16px}
.home-hero{text-align:center;display:grid;justify-items:center;gap:4px}
.home-hero h2{font-size:28px!important;margin:4px 0 0!important}
.home-hero p{margin:0;color:var(--muted)}
.home-hero .hero-tiles{flex-wrap:wrap;justify-content:center;--w:clamp(20px,5.2vw,34px)}
.home-hero .hero-tiles .tile{animation:dealIn .4s both}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;display:grid;gap:4px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),#11281f);color:var(--text);transition:transform .12s,border-color .15s,box-shadow .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.mode b{font-family:var(--f-tile);font-size:18px;letter-spacing:.05em}
.mode span{font-size:12.5px;color:var(--muted)}
.mode.main{background:linear-gradient(180deg,#f0c35a,#d9a133);border-color:#f3cf77;color:#2a1d00}
.mode.main span{color:#4d3600}
.quick{display:grid;gap:8px;background:rgba(0,0,0,.18);border-radius:12px;padding:10px 12px}
.home-foot{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:0}
.linkbtn{background:none;border:0;color:var(--gold);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
/* segmented controls */
.setgrid{display:grid;gap:10px;margin:12px 0}
.seg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.seg-l{font-size:13px;color:#cfe0d8;min-width:7em}
.seg-b{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-b button{background:transparent;border:0;color:var(--muted);font-size:12.5px;padding:5px 12px;border-radius:999px;transition:background .15s,color .15s}
.vsel{max-width:min(60vw,320px);padding:6px 10px;border-radius:999px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font:inherit;font-size:12.5px}
.seg-b button.on{background:var(--gold);color:#2a1d00;font-weight:700}
/* coach tabs */
.ctabs{display:flex;align-items:center;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.ctabs [data-tab]{position:relative;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:700;padding:8px 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.ctabs [data-tab].on{color:var(--gold);border-bottom-color:var(--gold)}
.ctabs .dot{position:absolute;top:6px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.ctabs .btn.mini{margin-left:auto}
.cpanel{padding:12px 14px;display:grid;gap:10px}
.coach{max-height:calc(100dvh - 80px);overflow-y:auto;position:sticky;top:8px}
@media (max-width:980px){.coach{max-height:none;position:static}}
/* preview line above the hand */
.preview{min-height:26px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:13px;color:#e7efe9;opacity:0;transition:opacity .15s;text-align:center}
.preview.show{opacity:1}
.preview .tile{--w:18px;vertical-align:middle;margin-bottom:2px}
.preview b{color:var(--gold)}
.preview .wt{display:inline-flex;align-items:flex-end;gap:1px;margin:0 2px}
.preview .wt sub{font-size:10px;color:var(--muted)}
.preview .tenpai{font:700 11px var(--f-body);color:#2a1d00;background:#7ff0b4;border-radius:4px;padding:1px 6px}
.preview .lv{font-size:11px;padding:0 6px;border-radius:4px}
/* drag */
.hand.active .tile.can{touch-action:none}
.hand .tile.dragging{transition:none!important;z-index:5;box-shadow:0 0 0 2px var(--gold),0 18px 30px rgba(0,0,0,.5)}
.hand .tile.will-drop{box-shadow:0 0 0 3px #7ff0b4,0 0 24px rgba(127,240,180,.7)}
.tray.myturn .hand{filter:drop-shadow(0 0 10px rgba(233,185,73,.25))}
/* chips */
.chips{display:inline-flex;gap:6px}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:1px 10px;font-size:11.5px}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(233,185,73,.1)}
.yourturn{font:700 11px var(--f-body);color:#2a1d00;background:#7ff0b4;border-radius:4px;padding:1px 6px;animation:pulse 1.2s ease-in-out infinite}
/* rank badge on plates */
.plate .rk{margin-left:auto;font:700 .8em var(--f-body);padding:0 .35em;border-radius:.3em;background:rgba(255,255,255,.1);color:#cfe0d8;flex:none}
.plate .rk.r1{background:var(--gold);color:#2a1d00}
/* pause */
.pause-ov{position:absolute;inset:0;z-index:8;display:grid;place-content:center;justify-items:center;gap:12px;background:rgba(3,14,11,.72);backdrop-filter:blur(2px)}
.pause-ov b{font-family:var(--f-tile);font-size:max(20px,5cqw);letter-spacing:.2em;color:var(--gold)}
/* walkthrough */
.tut{position:fixed;inset:0;z-index:80}
.tut-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(2,10,8,.72),0 0 0 2px var(--gold);transition:all .25s;pointer-events:none}
.tut-card{position:fixed;left:50%;transform:translateX(-50%);width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;display:grid;gap:6px;box-shadow:0 18px 40px rgba(0,0,0,.5);animation:sheetIn .25s}
.tut-card small{color:var(--muted)} .tut-card b{font-family:var(--f-tile);font-size:18px;color:var(--gold)} .tut-card p{margin:0;font-size:13.5px;line-height:1.7}
.tut-btns{display:flex;justify-content:flex-end;gap:8px}
.guide-list{display:grid;gap:10px;margin:10px 0}
.guide-list div{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.guide-list b{color:var(--gold)} .guide-list p{margin:4px 0 0;font-size:13px}

/* ---------- anime layer: mascot dock, cut-ins, particles ---------- */
.dock{width:100%;display:flex;align-items:center;gap:14px;min-height:56px;padding:0 2px}
.mascot{position:relative;width:60px;height:60px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.mascot svg{width:100%;height:100%;animation:mBob 2.6s ease-in-out infinite}
.mascot.hop svg{animation:mHop .45s cubic-bezier(.2,.9,.3,1.4),mBob 2.6s .45s ease-in-out infinite}
.mascot .name{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font:800 9.5px var(--f-round);background:#e2404a;color:#fff;border:1.5px solid #fff;border-radius:7px;padding:0 6px;white-space:nowrap;line-height:1.5}
.mk .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.mk .mouth{transform-box:fill-box;transform-origin:center}
.mascot.talking .mk .mouth{animation:talk .16s ease-in-out infinite alternate}
.bubble{position:relative;flex:1;min-width:0;background:#fffaf0;color:#2b2230;border:2.5px solid #2b2230;border-radius:18px;padding:8px 14px;
  font:700 14px/1.6 var(--f-round);box-shadow:0 4px 0 rgba(0,0,0,.28)}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;margin-top:-9px;border-style:solid;border-width:9px 13px 9px 0;border-color:transparent #2b2230 transparent transparent}
.bubble::after{content:"";position:absolute;left:-8.5px;top:50%;margin-top:-6px;border-style:solid;border-width:6px 9px 6px 0;border-color:transparent #fffaf0 transparent transparent}
.bubble.pop{animation:bubPop .32s cubic-bezier(.2,.9,.3,1.5)}
.bubble-in.say{animation:sayIn .55s steps(14,end)}
.bubble .tile{--w:19px;vertical-align:middle;margin-bottom:2px}
.bubble strong{color:#c0392b} .bubble b{color:#b4580a}
.bubble .note{color:#6b5f55}
.bubble .pro{display:none}
.bubble .lv{font-size:11px;padding:0 6px;border-radius:4px}
.bubble .yourturn{background:#2fbf71;color:#fff}
.dock-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
@media (max-width:640px){.dock{gap:12px;flex-wrap:wrap}.mascot{width:50px;height:50px}.bubble{font-size:13px;padding:7px 11px;flex-basis:0}.dock-side{flex-direction:row;width:100%;justify-content:center}}

/* pop typography */
.callout{font-family:var(--f-pop)!important;font-weight:400!important;letter-spacing:.04em!important;color:#fff!important;-webkit-text-stroke:.5cqw #14213d!important;
  text-shadow:.7cqw .7cqw 0 #14213d,0 0 3cqw rgba(140,200,255,.9)!important;paint-order:stroke fill}
.callout.riichi{-webkit-text-stroke-color:#5a2100!important;text-shadow:.7cqw .7cqw 0 #5a2100,0 0 3cqw rgba(255,170,60,.9)!important}
.banner b{font-family:var(--f-pop)!important;font-weight:400!important;letter-spacing:.12em!important;color:#fff!important;-webkit-text-stroke:.35cqw #5a3a00;paint-order:stroke fill;text-shadow:.5cqw .5cqw 0 #5a3a00,0 0 2.4cqw rgba(255,210,90,.8)!important}
.banner{background:linear-gradient(90deg,transparent,rgba(26,16,40,.9) 15%,rgba(26,16,40,.9) 85%,transparent)!important;border-block:.4cqw solid var(--gold)}
.banner::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.06) 0 1.5cqw,transparent 1.5cqw 3cqw);animation:stripeMove .8s linear infinite}
.pill{font-family:var(--f-round)!important;font-weight:800!important;border:2.5px solid rgba(255,255,255,.9)!important;letter-spacing:.06em}
.pill:hover{transform:translateY(-2px) scale(1.04)}
.mode b{font-family:var(--f-pop)!important;font-weight:400!important}
.home-hero h2{font-family:var(--f-pop)!important;font-weight:400!important;letter-spacing:.08em}

/* cut-in */
.cutin{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.cutin .ci-lines{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,transparent 0 5deg,rgba(255,255,255,.22) 5deg 6deg);
  -webkit-mask:radial-gradient(circle,transparent 16%,#000 42%);mask:radial-gradient(circle,transparent 16%,#000 42%);animation:ciLines 1.75s ease-out forwards}
.cutin .ci-band{position:absolute;left:-12%;right:-12%;top:50%;height:30cqw;margin-top:-15cqw;background:linear-gradient(100deg,var(--c1),var(--c2));
  box-shadow:0 0 0 .9cqw #fff,0 0 0 1.6cqw #14213d,0 3cqw 6cqw rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:3cqw;overflow:hidden;
  animation:ciBand 1.75s cubic-bezier(.2,.9,.3,1) forwards}
.cutin .ci-band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.14) 0 2cqw,transparent 2cqw 4cqw);animation:stripeMove .5s linear infinite}
.cutin b{position:relative;font-family:var(--f-pop);font-weight:400;font-size:16cqw;line-height:1;color:#fff;-webkit-text-stroke:.7cqw #14213d;paint-order:stroke fill;
  text-shadow:1cqw 1cqw 0 #14213d;animation:ciText 1.75s cubic-bezier(.2,.9,.3,1.3) forwards}
.cutin small{position:absolute;right:14%;bottom:2.4cqw;font:800 max(11px,2.8cqw) var(--f-round);color:#fff;text-shadow:0 .3cqw 0 rgba(0,0,0,.5)}
.cutin .ci-mascot{position:relative;width:24cqw;height:24cqw;animation:ciMascot 1.75s cubic-bezier(.2,.9,.3,1.2) forwards;filter:drop-shadow(0 1cqw 0 rgba(0,0,0,.35))}
.cutin .ci-mascot svg{width:100%;height:100%}
.cutin.riichi{--c1:#ffb627;--c2:#ff5e3a} .cutin.ron{--c1:#ff3d6e;--c2:#7b2cbf} .cutin.tsumo{--c1:#ffd23f;--c2:#ff7b1c}
.board.shake{animation:shake .5s}
.spark{position:absolute;width:var(--s);height:var(--s);background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:ptFly .95s ease-out forwards;z-index:6}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.confetti i{position:absolute;top:-4vh;left:var(--x);width:9px;height:14px;border-radius:2px;background:var(--c);transform:rotate(var(--r));animation:fall var(--d) var(--dl) linear forwards}

/* result sheet: coach reaction + rays */
.res-coach{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.res-coach .mascot{width:70px;height:70px}
.res-coach .bubble{flex:0 1 auto}
.score-wrap{position:relative;display:inline-block;padding:8px 20px;isolation:isolate}
.score-wrap .rays{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;z-index:-1;
  background:repeating-conic-gradient(rgba(255,210,90,.28) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 9s linear infinite}
.big-score{font-family:var(--f-pop)!important;font-weight:400!important;-webkit-text-stroke:1px #5a3a00}
.stamp{font-family:var(--f-pop)!important;font-weight:400!important;border:2px solid #fff}

@keyframes mBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes mHop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.06,.94)}70%{transform:translateY(0) scale(.96,1.05)}100%{transform:none}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes bubPop{0%{transform:scale(.92)}60%{transform:scale(1.03)}100%{transform:none}}
@keyframes sayIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes stripeMove{from{background-position:0 0}to{background-position:4cqw 0}}
@keyframes ciLines{0%{opacity:0;transform:rotate(0)}12%{opacity:1}85%{opacity:.8}100%{opacity:0;transform:rotate(20deg)}}
@keyframes ciBand{0%{transform:skewY(-7deg) translateX(-125%)}13%{transform:skewY(-7deg) translateX(0)}82%{transform:skewY(-7deg) translateX(0);opacity:1}100%{transform:skewY(-7deg) translateX(125%);opacity:0}}
@keyframes ciText{0%{transform:skewY(7deg) scale(2.8);opacity:0}18%{transform:skewY(7deg) scale(.9);opacity:1}26%{transform:skewY(7deg) scale(1.06)}34%,100%{transform:skewY(7deg) scale(1)}}
@keyframes ciMascot{0%{transform:skewY(7deg) translateX(-40cqw) rotate(-20deg)}20%{transform:skewY(7deg) translateX(0) rotate(6deg)}30%,100%{transform:skewY(7deg) rotate(0)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-1.4cqw,.7cqw) rotate(-.4deg)}30%{transform:translate(1.2cqw,-.9cqw) rotate(.4deg)}45%{transform:translate(-.9cqw,.5cqw)}60%{transform:translate(.6cqw,-.4cqw)}80%{transform:translate(-.3cqw,.2cqw)}}
@keyframes ptFly{from{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(200deg);opacity:0}}
@keyframes fall{to{transform:translateY(112vh) rotate(calc(var(--r) + 760deg))}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- coach ---------- */
.coach{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.coach section{padding:12px 14px;border-bottom:1px solid var(--line)}
.coach h2{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 6px;font-weight:700}
.coach h2 .who{font-family:var(--f-tile);color:var(--gold);letter-spacing:.04em;font-size:13px}
.advice-main{font-size:15px;line-height:1.7}
.advice-main strong{color:var(--gold)}
.advice-main .tile,.coach .tile{--w:22px;vertical-align:middle;margin:0 1px}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:12.5px;margin-top:8px}
.cand .lv{font-size:11px;padding:0 6px;border-radius:4px;white-space:nowrap}
.lv.l0{background:rgba(76,195,138,.18);color:var(--safe)} .lv.l1{background:rgba(155,209,122,.15);color:#b7e09c}
.lv.l2{background:rgba(233,185,73,.16);color:var(--warn)} .lv.l3{background:rgba(240,96,90,.18);color:var(--danger)}
.note{font-size:12.5px;color:var(--muted)}
ul.reads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.reads li{font-size:12.5px}
ul.reads b{color:var(--text)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;margin-right:4px;background:var(--panel-2);border:1px solid var(--line)}
.tag.hot{border-color:var(--danger);color:#ffb4ae}
.tag.good{border-color:var(--safe);color:#a6e8c7}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.log{max-height:220px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.log div{border-left:2px solid var(--line);padding-left:8px}
.log div.imp{border-color:var(--gold)}
.tip{font-size:12.5px;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.tip b{color:var(--gold)}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(3,14,11,.78);display:grid;place-items:center;z-index:50;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:18px 20px}
.sheet h2{font-family:var(--f-tile);font-size:22px;margin:0 0 8px;letter-spacing:.05em}
.sheet h3{font-size:14px;margin:16px 0 6px;color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.opt label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.opt select{width:100%;padding:7px;border-radius:8px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-family:inherit}
.res-hand{display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end;--w:30px;margin:8px 0}
.res-hand .sp{width:10px}
table.yaku{border-collapse:collapse;width:100%;font-size:14px}
table.yaku td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.yaku td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}
table.yaku .ex{font-size:12px;color:var(--muted)}
.big-score{font-family:var(--f-tile);font-size:30px;color:var(--gold);font-weight:800}
.deltas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.deltas div{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:13px}
.deltas .up{color:var(--safe)} .deltas .down{color:var(--danger)}
.ydict{display:grid;gap:10px}
.ydict .y{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.ydict .y header{padding:0;gap:8px}
.ydict .y .nm{font-family:var(--f-tile);font-size:17px;font-weight:800}
.ydict .y .rd{color:var(--muted);font-size:12px}
.ydict .y .hn{margin-left:auto;color:var(--gold);font-weight:700;font-size:13px}
.ydict .ex{display:flex;gap:1px;flex-wrap:wrap;--w:20px;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
.reveal{display:grid;gap:6px;margin-top:10px}
.reveal .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;--w:19px}
.reveal .row .nm{width:90px;font-size:12px;color:var(--muted)}
.hero-tiles{display:flex;gap:4px;--w:34px;margin:6px 0 4px}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.mini{padding:1px 8px;font-size:11px;margin-left:auto;letter-spacing:0}
.coach h2{display:flex;align-items:center;gap:6px}
.badge.you{border-color:var(--gold);color:var(--gold)}
.net{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.net .dot{width:8px;height:8px;border-radius:50%;background:var(--safe)} .net .dot.off{background:var(--danger)}
.opt input{width:100%;padding:8px;border-radius:8px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);font:inherit}
.opt input:focus{outline:2px solid var(--gold);outline-offset:1px}
.msgline{min-height:1.4em;color:var(--gold);font-size:13px}
ul.seats{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
ul.seats li{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.waiting{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted);font-size:14px}
.stamps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--gold);color:#2a1d00;font-weight:700;padding:8px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100vw - 32px)}
.toast.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.tile.mark-bad{box-shadow:0 0 0 2px var(--danger),0 calc(var(--w)*.08) 0 var(--back-deep)}
.tile.mark-good{box-shadow:0 0 0 2px var(--gold),0 calc(var(--w)*.08) 0 var(--back-deep)}
.rv{display:grid;gap:10px}
.rv-item{background:var(--panel-2);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.rv-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.rv-item .ex,.rv-head{--w:20px}
.rv-item .ex{display:flex;gap:1px;flex-wrap:wrap}
.drill-hand{display:flex;gap:3px;flex-wrap:wrap;--w:clamp(22px,5.6vw,42px);margin:10px 0}
.drill-hand .tile.can{cursor:pointer;transition:transform .12s}
.drill-hand .tile.can:hover{transform:translateY(-4px)}
.drill-stats{font-size:13px;color:var(--muted)}
.drill-stats b{color:var(--gold)}
</style>
</head>
<body>

<script>
// LOGIC-BEGIN
const HONOR=['東','南','西','北','白','發','中'];
const KANJI=['一','二','三','四','五','六','七','八','九'];
const YAOCHU=[0,8,9,17,18,26,27,28,29,30,31,32,33];
const suitOf=t=>t<27?Math.floor(t/9):3;
const isHonor=t=>t>=27;
const isYaochu=t=>t>=27||t%9===0||t%9===8;
const isDragon=t=>t>=31;
const isWindT=t=>t>=27&&t<=30;
function tName(t){if(t<9)return KANJI[t]+'萬';if(t<18)return(t-8)+'筒';if(t<27)return(t-17)+'索';return HONOR[t-27];}
function doraOf(i){if(i<27){const b=i-i%9;return b+(i%9+1)%9;}if(i<=30)return 27+(i-26)%4;return 31+(i-30)%3;}
function toCounts(a){const c=new Array(34).fill(0);for(const t of a)c[t]++;return c;}
function removeOne(a,t){const i=a.indexOf(t);if(i>=0)a.splice(i,1);return i>=0;}
function parseTiles(s){const out=[];let buf=[];for(const ch of s){if(/[0-9]/.test(ch))buf.push(+ch);else{const base={m:0,p:9,s:18,z:27}[ch];for(const n of buf)out.push(base+n-1);buf=[];}}return out;}

const shCache=new Map();
function shantenNormal(c,fixed){
  const key=c.join('')+fixed;const hit=shCache.get(key);if(hit!==undefined)return hit;
  let best=8,mentsu=fixed,taatsu=0,pair=0;
  function scan(i){
    while(i<34&&c[i]===0)i++;
    if(i>=34){let t=taatsu;if(mentsu+t>4)t=4-mentsu;const s=8-2*mentsu-t-pair;if(s<best)best=s;return;}
    if(c[i]>=3){c[i]-=3;mentsu++;scan(i);mentsu--;c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;mentsu++;scan(i);mentsu--;c[i]++;c[i+1]++;c[i+2]++;}
    if(mentsu+taatsu<4){
      if(c[i]>=2){c[i]-=2;taatsu++;scan(i);taatsu--;c[i]+=2;}
      if(i<27&&i%9<=7&&c[i+1]>0){c[i]--;c[i+1]--;taatsu++;scan(i);taatsu--;c[i]++;c[i+1]++;}
      if(i<27&&i%9<=6&&c[i+2]>0){c[i]--;c[i+2]--;taatsu++;scan(i);taatsu--;c[i]++;c[i+2]++;}
    }
    const s=c[i];c[i]=0;scan(i+1);c[i]=s;
  }
  scan(0);
  for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;pair=1;scan(0);pair=0;c[i]+=2;}
  if(shCache.size>300000)shCache.clear();
  shCache.set(key,best);return best;
}
function shantenChiitoi(c){let p=0,k=0;for(let i=0;i<34;i++){if(c[i]>=1)k++;if(c[i]>=2)p++;}return 6-p+Math.max(0,7-k);}
function shantenKokushi(c){let k=0,p=0;for(const t of YAOCHU){if(c[t]>0){k++;if(c[t]>=2)p=1;}}return 13-k-p;}
function shantenAll(c,melds){const n=shantenNormal(c,melds);if(melds>0)return n;return Math.min(n,shantenChiitoi(c),shantenKokushi(c));}
function getWaits(hand,meldCount){const c=toCounts(hand);const w=[];for(let t=0;t<34;t++){if(c[t]>=4)continue;c[t]++;if(shantenAll(c,meldCount)===-1)w.push(t);c[t]--;}return w;}

function decompose(c){const res=[];for(let p=0;p<34;p++){if(c[p]>=2){c[p]-=2;dfsSets(c,0,[],res,p);c[p]+=2;}}return res;}
function dfsSets(c,i,sets,res,p){
  while(i<34&&c[i]===0)i++;
  if(i>=34){res.push({pair:p,sets:sets.slice()});return;}
  if(c[i]>=3){c[i]-=3;sets.push({k:'k',t:i});dfsSets(c,i,sets,res,p);sets.pop();c[i]+=3;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;sets.push({k:'s',t:i});dfsSets(c,i,sets,res,p);sets.pop();c[i]++;c[i+1]++;c[i+2]++;}
}

function calcScore(han,fu,ym,isDealer,tsumo){
  let base,label='';
  if(ym>0){base=8000*ym;label=ym>1?ym+'倍役満':'役満';}
  else if(han>=13){base=8000;label='数え役満';}
  else if(han>=11){base=6000;label='三倍満';}
  else if(han>=8){base=4000;label='倍満';}
  else if(han>=6){base=3000;label='跳満';}
  else if(han>=5){base=2000;label='満貫';}
  else{base=fu*Math.pow(2,han+2);if(base>=2000){base=2000;label='満貫';}}
  const up=x=>Math.ceil(x/100)*100;
  if(!tsumo){const r=up(base*(isDealer?6:4));return{ron:r,total:r,label};}
  if(isDealer){const e=up(base*2);return{each:e,total:e*3,label};}
  const d=up(base*2),o=up(base);return{dealerPay:d,otherPay:o,total:d+o*2,label};
}

// ctx:{hand,melds,winTile,tsumo,seatWind,roundWind,riichi,doubleRiichi,ippatsu,haitei,houtei,rinshan,tenhou,chiihou,doraInd,uraInd,isDealer}
function evaluateHand(ctx){
  const c=toCounts(ctx.hand);
  const closed=ctx.melds.every(m=>m.type==='ankan');
  const all=ctx.hand.concat(...ctx.melds.map(m=>m.tiles));
  const yakuhaiT=t=>isDragon(t)||t===ctx.seatWind||t===ctx.roundWind;
  const cands=[];
  const situ=()=>{const y=[];
    if(ctx.doubleRiichi)y.push(['ダブル立直',2]);else if(ctx.riichi)y.push(['立直',1]);
    if(ctx.ippatsu)y.push(['一発',1]);
    if(ctx.tsumo&&closed)y.push(['門前清自摸和',1]);
    if(ctx.haitei)y.push(['海底摸月',1]);if(ctx.houtei)y.push(['河底撈魚',1]);if(ctx.rinshan)y.push(['嶺上開花',1]);
    return y;};
  const situYm=()=>{const y=[];if(ctx.tenhou)y.push(['天和',13]);if(ctx.chiihou)y.push(['地和',13]);return y;};
  const allHonor=all.every(isHonor);
  const GREEN=new Set([19,20,21,23,25,32]);
  const allGreen=all.every(t=>GREEN.has(t));
  const allTerm=all.every(t=>t<27&&(t%9===0||t%9===8));
  const numSuits=new Set(all.filter(t=>t<27).map(suitOf));
  const hasHonor=all.some(isHonor);
  const flush=()=>{if(numSuits.size===1)return hasHonor?['混一色',closed?3:2]:['清一色',closed?6:5];return null;};
  // kokushi
  if(ctx.melds.length===0&&shantenKokushi(c)===-1){cands.push({ym:situYm().concat([['国士無双',13]]),fu:0});}
  // chiitoi
  if(ctx.melds.length===0&&shantenChiitoi(c)===-1){
    if(allHonor)cands.push({ym:situYm().concat([['字一色',13]]),fu:25});
    else{const y=situ();y.push(['七対子',2]);
      if(all.every(t=>!isYaochu(t)))y.push(['断么九',1]);
      if(all.every(isYaochu))y.push(['混老頭',2]);
      const f=flush();if(f)y.push(f);
      const sy=situYm();cands.push(sy.length?{ym:sy,fu:25}:{yaku:y,fu:25});}
  }
  // normal
  for(const d of decompose(c.slice())){
    const base=d.sets.map(s=>({k:s.k,t:s.t,open:false,meld:false}));
    const meldSets=ctx.melds.map(m=>{const t=Math.min(...m.tiles);
      if(m.type==='chi')return{k:'s',t,open:true,meld:true};
      if(m.type==='pon')return{k:'k',t,open:true,meld:true};
      return{k:'q',t,open:m.type!=='ankan',meld:true};});
    const waitOpts=[];
    base.forEach((s,i)=>{const w=ctx.winTile;
      if(s.k==='k'&&s.t===w)waitOpts.push({i,wt:'shanpon'});
      if(s.k==='s'&&w>=s.t&&w<=s.t+2){let wt='ryanmen';const n=s.t%9;
        if(w===s.t+1)wt='kanchan';else if((w===s.t+2&&n===0)||(w===s.t&&n===6))wt='penchan';
        waitOpts.push({i,wt});}});
    if(d.pair===ctx.winTile)waitOpts.push({i:-1,wt:'tanki'});
    for(const wo of waitOpts){
      const sets=base.map(s=>({...s}));
      if(wo.wt==='shanpon'&&!ctx.tsumo)sets[wo.i].open=true;
      const S=sets.concat(meldSets);
      const shun=S.filter(s=>s.k==='s'), kou=S.filter(s=>s.k!=='s');
      const anko=kou.filter(s=>!s.open).length;
      const kans=S.filter(s=>s.k==='q').length;
      const dragonKou=kou.filter(s=>isDragon(s.t)).length;
      const windKou=kou.filter(s=>isWindT(s.t)).length;
      // yakuman
      const ym=situYm();
      if(anko===4)ym.push([wo.wt==='tanki'?'四暗刻単騎':'四暗刻',13]);
      if(dragonKou===3)ym.push(['大三元',13]);
      if(windKou===4)ym.push(['大四喜',13]);else if(windKou===3&&isWindT(d.pair))ym.push(['小四喜',13]);
      if(allHonor)ym.push(['字一色',13]);
      if(allGreen)ym.push(['緑一色',13]);
      if(allTerm)ym.push(['清老頭',13]);
      if(kans===4)ym.push(['四槓子',13]);
      if(closed&&numSuits.size===1&&!hasHonor){const s0=all[0]-all[0]%9;const cc=toCounts(all);const pat=[3,1,1,1,1,1,1,1,3];
        if(pat.every((v,k)=>cc[s0+k]>=v))ym.push(['九蓮宝燈',13]);}
      if(ym.length){cands.push({ym,fu:0});continue;}
      const y=situ();
      const pinfu=closed&&shun.length===4&&!yakuhaiT(d.pair)&&wo.wt==='ryanmen';
      if(pinfu)y.push(['平和',1]);
      if(all.every(t=>!isYaochu(t)))y.push(['断么九',1]);
      if(closed){const cnt={};shun.forEach(s=>cnt[s.t]=(cnt[s.t]||0)+1);let pk=0;for(const k in cnt)pk+=Math.floor(cnt[k]/2);
        if(pk===2)y.push(['二盃口',3]);else if(pk===1)y.push(['一盃口',1]);}
      for(const s of kou){if(s.t===31)y.push(['役牌 白',1]);if(s.t===32)y.push(['役牌 發',1]);if(s.t===33)y.push(['役牌 中',1]);
        if(s.t===ctx.seatWind)y.push(['自風 '+HONOR[s.t-27],1]);if(s.t===ctx.roundWind)y.push(['場風 '+HONOR[s.t-27],1]);}
      const st=new Set(shun.map(s=>s.t));
      for(let n=0;n<7;n++)if(st.has(n)&&st.has(n+9)&&st.has(n+18)){y.push(['三色同順',closed?2:1]);break;}
      for(let s=0;s<3;s++)if(st.has(s*9)&&st.has(s*9+3)&&st.has(s*9+6)){y.push(['一気通貫',closed?2:1]);break;}
      const kt=new Set(kou.map(s=>s.t));
      for(let n=0;n<9;n++)if(kt.has(n)&&kt.has(n+9)&&kt.has(n+18)){y.push(['三色同刻',2]);break;}
      if(kou.length===4)y.push(['対々和',2]);
      if(anko===3)y.push(['三暗刻',2]);
      if(kans===3)y.push(['三槓子',2]);
      const setHasY=s=>s.k==='s'?(s.t%9===0||s.t%9===6):isYaochu(s.t);
      if(all.every(isYaochu))y.push(['混老頭',2]);
      else if(shun.length>0&&S.every(setHasY)&&isYaochu(d.pair)){
        if(hasHonor)y.push(['混全帯么九',closed?2:1]);else y.push(['純全帯么九',closed?3:2]);}
      if(dragonKou===2&&isDragon(d.pair))y.push(['小三元',2]);
      const f=flush();if(f)y.push(f);
      // fu
      let fu;
      if(pinfu)fu=ctx.tsumo?20:30;
      else{fu=20;if(closed&&!ctx.tsumo)fu+=10;if(ctx.tsumo)fu+=2;
        for(const s of kou){let v=2;if(isYaochu(s.t))v*=2;if(!s.open)v*=2;if(s.k==='q')v*=4;fu+=v;}
        if(isDragon(d.pair))fu+=2;if(d.pair===ctx.seatWind)fu+=2;if(d.pair===ctx.roundWind)fu+=2;
        if(wo.wt==='kanchan'||wo.wt==='penchan'||wo.wt==='tanki')fu+=2;
        fu=Math.ceil(fu/10)*10;if(fu===20)fu=30;}
      cands.push({yaku:y,fu,wait:wo.wt});
    }
  }
  if(!cands.length)return{valid:false,reason:'形'};
  // dora
  const doraT=ctx.doraInd.map(doraOf), uraT=(ctx.uraInd||[]).map(doraOf);
  const dora=all.reduce((a,t)=>a+doraT.filter(x=>x===t).length,0);
  const ura=all.reduce((a,t)=>a+uraT.filter(x=>x===t).length,0);
  let best=null;
  for(const cd of cands){
    let r;
    if(cd.ym){const ymc=cd.ym.length;r={yaku:cd.ym.map(([n])=>({name:n,han:'役満'})),ym:ymc,han:13*ymc,fu:0};}
    else{if(!cd.yaku.length)continue;
      const ys=cd.yaku.map(([n,h])=>({name:n,han:h}));let han=ys.reduce((a,b)=>a+b.han,0);
      if(dora){ys.push({name:'ドラ',han:dora});han+=dora;}
      if(ura){ys.push({name:'裏ドラ',han:ura});han+=ura;}
      r={yaku:ys,ym:0,han,fu:cd.fu,wait:cd.wait};}
    r.score=calcScore(r.han,r.fu,r.ym,ctx.isDealer,ctx.tsumo);
    if(!best||r.score.total>best.score.total||(r.score.total===best.score.total&&r.han>best.han))best=r;
  }
  if(!best)return{valid:false,reason:'役なし'};
  best.valid=true;return best;
}

function tileDanger(t,gen,vis,yakuhaiFor){
  if(gen.has(t))return{d:0,why:'現物'};
  if(t>=27){const v=vis[t];let d=v>=3?0.3:v===2?1.5:v===1?3:4.5;if(yakuhaiFor&&yakuhaiFor(t)&&v<2)d+=1;
    return{d,why:v>=3?'字牌・ラス牌(3枚見え)':v===2?'字牌・2枚見え':v===1?'字牌・1枚見え':'生牌の字牌(1枚も見えていない)'};}
  const n=t%9,b=t-n;let ryan=0,suji=0,kabe=0;
  if(n<=5){if(gen.has(b+n+3))suji++;else if(vis[b+n+1]>=4||vis[b+n+2]>=4)kabe++;else ryan++;}
  if(n>=3){if(gen.has(b+n-3))suji++;else if(vis[b+n-1]>=4||vis[b+n-2]>=4)kabe++;else ryan++;}
  const kan=(n>=1&&n<=7&&vis[b+n-1]<4&&vis[b+n+1]<4)?1:0;
  const pen=((n===2&&vis[b]<4&&vis[b+1]<4)||(n===6&&vis[b+7]<4&&vis[b+8]<4))?1:0;
  const sh=vis[t]>=3?0:vis[t]===2?1:2;
  const d=4*ryan+1.5*(kan+pen)+0.8*sh;
  let why;
  if(ryan===0&&suji>0)why=(n===0||n===8)?'筋の端牌(かなり安全)':'筋(両面待ちには当たらない)';
  else if(ryan===0&&kabe>0)why='壁(ノーチャンス)';
  else if(ryan===0)why=(n===0||n===8)?'端牌':'片筋';
  else if(n>=3&&n<=5&&ryan===1)why='片筋の中張牌';
  else why=(n>=3&&n<=5)?'無筋の中張牌(危険)':'無筋';
  return{d,why};
}

// ================= visibility / analysis =================
function visibleFor(P){
  const v=new Array(34).fill(0);
  for(const t of P.hand)if(t>=0)v[t]++;
  for(const q of G.players){for(const d of q.discards)if(!d.called)v[d.t]++;for(const m of q.melds)for(const t of m.tiles)v[t]++;}
  for(const t of G.doraInd.slice(0,G.doraCount))v[t]++;
  for(let i=0;i<34;i++)if(v[i]>4)v[i]=4;
  return v;
}
function genbutsuOf(q){
  const g=new Set(q.discards.map(d=>d.t));
  if(q.riichi)for(const d of G.allDiscards)if(d.seq>q.riichiSeq)g.add(d.t);
  return g;
}
const yakuhaiFor=q=>t=>isDragon(t)||t===q.seatWind||t===G.roundWind;
function threatsFor(P){
  const out=[];
  for(const q of G.players){if(q===P)continue;
    if(q.riichi){out.push({q,w:1,kind:'リーチ'});continue;}
    const open=q.melds.filter(m=>m.type!=='ankan');
    if(open.length>=3)out.push({q,w:0.7,kind:'3副露'});
    else if(open.length>=2&&(open.some(m=>m.type!=='chi'&&yakuhaiFor(q)(m.tiles[0]))||G.live.length<30))out.push({q,w:0.45,kind:'2副露'});
  }
  return out;
}
function suitFocus(q){
  const melds=q.melds.filter(m=>m.tiles[0]<27);const ds=q.discards.map(d=>d.t);
  if(ds.length<6&&melds.length===0)return null;
  for(let s=0;s<3;s++){const meldIn=melds.length>0&&melds.every(m=>suitOf(m.tiles[0])===s);const discIn=ds.filter(t=>t<27&&suitOf(t)===s).length;
    const discOther=ds.filter(t=>t<27&&suitOf(t)!==s).length;
    if((meldIn&&discIn<=1)||(ds.length>=8&&discIn===0&&discOther>=5))return s;}
  return null;
}
function dangerFor(P,t,threats,vis){
  let best={d:0,why:'',who:null};
  for(const th of threats){const r=tileDanger(t,genbutsuOf(th.q),vis,yakuhaiFor(th.q));let d=r.d*th.w;
    const sf=suitFocus(th.q);if(sf!==null&&!th.q.riichi){if(t<27&&suitOf(t)===sf)d*=1.6;else if(t<27)d*=0.35;}
    if(d>best.d||best.who===null)best={d,why:r.why,who:th.q};}
  return best;
}
function ukeire(c,m,sh,vis){
  let count=0;const tiles=[];
  for(let u=0;u<34;u++){const rem=4-vis[u];if(rem<=0)continue;
    let near=c[u]>0;
    if(!near&&u<27){const b=u-u%9;for(let k=Math.max(b,u-2);k<=Math.min(b+8,u+2);k++)if(c[k]>0){near=true;break;}}
    if(!near&&m===0&&isYaochu(u))near=true;
    if(!near)continue;
    c[u]++;if(shantenAll(c,m)<sh){count+=rem;tiles.push(u);}c[u]--;}
  return{count,tiles};
}
function analyzeDiscards(P,forbidden=[]){
  const vis=visibleFor(P);const c=toCounts(P.hand);const m=P.melds.length;const seen=new Set();const opts=[];
  const threats=threatsFor(P);const doraT=G.doraInd.slice(0,G.doraCount).map(doraOf);
  for(const t of P.hand){if(seen.has(t))continue;seen.add(t);
    if(forbidden.includes(t)&&P.hand.some(x=>!forbidden.includes(x)))continue;
    c[t]--;const sh=shantenAll(c,m);const uk=ukeire(c,m,sh,vis);c[t]++;
    const dg=threats.length?dangerFor(P,t,threats,vis):{d:0,why:''};
    let pen=0;if(doraT.includes(t))pen+=3;
    if(t>=27){if(c[t]===1)pen-=(yakuhaiFor(P)(t)?0.5:1.5);else if(yakuhaiFor(P)(t))pen+=2;}
    else if((t%9===0||t%9===8)&&c[t]===1)pen-=0.6;
    opts.push({t,shanten:sh,ukeire:uk.count,ukeTiles:uk.tiles,danger:dg.d,why:dg.why,who:dg.who,pen});}
  opts.sort((a,b)=>a.shanten-b.shanten||b.ukeire-a.ukeire||a.pen-b.pen);
  return{opts,threats,vis};
}
function chooseDiscard(P,forbidden,style){
  const A=analyzeDiscards(P,forbidden);const top=A.opts[0];
  let fold=false;
  if(A.threats.some(th=>th.w>=0.7)){
    const sh=top.shanten;
    if(style==='attack')fold=sh>=2&&top.danger>=2;
    else if(style==='defense')fold=sh>=1||(sh===0&&top.danger>=5);
    else fold=sh>=2||(sh===1&&top.danger>=4);
  }
  if(fold){const safe=A.opts.slice().sort((a,b)=>a.danger-b.danger||a.shanten-b.shanten||b.ukeire-a.ukeire);return{opt:safe[0],fold:true,A};}
  return{opt:top,fold:false,A};
}
function winCtx(P,t,tsumo,rinshan){
  const hand=tsumo?P.hand.slice():P.hand.concat([t]);
  const first=P.discards.length===0&&G.noCalls&&!rinshan;
  return{hand,melds:P.melds,winTile:t,tsumo,seatWind:P.seatWind,roundWind:G.roundWind,riichi:P.riichi,doubleRiichi:P.doubleRiichi,
    ippatsu:P.riichi&&P.ippatsu,haitei:tsumo&&G.live.length===0&&!rinshan,houtei:!tsumo&&G.live.length===0,rinshan:!!rinshan,
    tenhou:tsumo&&first&&P.id===G.dealer,chiihou:tsumo&&first&&P.id!==G.dealer,
    doraInd:G.doraInd.slice(0,G.doraCount),uraInd:P.riichi&&G.uraInd?G.uraInd.slice(0,G.doraCount):[],isDealer:P.id===G.dealer};
}
function isFuriten(P,waits){return P.furitenTemp||P.riichiFuriten||waits.some(w=>P.discards.some(d=>d.t===w));}
function riichiOptions(P){
  if(P.riichi||P.melds.some(m=>m.type!=='ankan')||P.score<1000||G.live.length<4)return[];
  const c=toCounts(P.hand);const out=[];const seen=new Set();
  for(const t of P.hand){if(seen.has(t))continue;seen.add(t);c[t]--;if(shantenAll(c,P.melds.length)===0)out.push(t);c[t]++;}
  return out;
}
function selfKanOptions(P){
  if(G.kanCount>=4||G.live.length===0)return[];
  const c=toCounts(P.hand);const out=[];
  if(!P.riichi){for(let t=0;t<34;t++)if(c[t]===4)out.push({type:'ankan',t});
    for(const m of P.melds)if(m.type==='pon'&&c[m.tiles[0]]>=1)out.push({type:'kakan',t:m.tiles[0]});}
  return out;
}
function openYakuPaths(hand,melds,P){
  const all=hand.concat(...melds.map(m=>m.tiles));const c=toCounts(hand);const yh=yakuhaiFor(P);const paths=[];
  if(melds.some(m=>m.type!=='chi'&&yh(m.tiles[0])))paths.push('役牌');
  else{for(let t=27;t<34;t++)if(yh(t)&&c[t]>=2){paths.push('役牌候補');break;}}
  if(melds.every(m=>m.tiles.every(x=>!isYaochu(x)))&&hand.filter(isYaochu).length<=1)paths.push('断么九');
  for(let s=0;s<3;s++){const off=all.filter(x=>x<27&&suitOf(x)!==s).length;const meldOk=melds.every(m=>m.tiles[0]>=27||suitOf(m.tiles[0])===s);
    if(meldOk&&off<=1&&all.some(x=>x<27&&suitOf(x)===s)){paths.push(all.some(isHonor)?'混一色':'清一色');break;}}
  if(melds.every(m=>m.type!=='chi')){const pairs=c.filter(x=>x>=2).length;if(pairs>=4-melds.length)paths.push('対々和');}
  return paths;
}
function evalCall(P,t,kind,use){
  const before=shantenAll(toCounts(P.hand),P.melds.length);
  const nh=P.hand.slice();use.forEach(x=>removeOne(nh,x));
  const tiles=kind==='chi'?sortTiles(use.concat([t])):use.concat([t]);
  const nm=P.melds.concat([{type:kind,tiles}]);
  const c=toCounts(nh);let after=9;
  if(kind==='minkan')after=shantenNormal(c,nm.length);
  else for(const u of new Set(nh)){if(u===t)continue;c[u]--;after=Math.min(after,shantenNormal(c,nm.length));c[u]++;}
  return{before,after,paths:openYakuPaths(nh,nm,P),tiles};
}
function chiOptions(P,t){
  if(t>=27)return[];const n=t%9,c=toCounts(P.hand),out=[];
  if(n>=2&&c[t-2]&&c[t-1])out.push([t-2,t-1]);
  if(n>=1&&n<=7&&c[t-1]&&c[t+1])out.push([t-1,t+1]);
  if(n<=6&&c[t+1]&&c[t+2])out.push([t+1,t+2]);
  return out;
}
function cpuWantsCall(P,t,kind,use){
  const ev=evalCall(P,t,kind,use);const st=P.style;
  if(P.melds.length===0&&ev.before<=1&&kind!=='minkan'&&!(kind==='pon'&&isDragon(t)))return false;
  if(kind==='pon'&&yakuhaiFor(P)(t))return ev.after<=ev.before;
  const real=ev.paths.filter(x=>x!=='役牌候補');
  if(!real.length||kind==='minkan')return false;
  const lim=st==='naki'?4:st==='defense'?1:2;
  return ev.after<ev.before&&ev.before<=lim;
}

// ================= GAME FLOW =================
const CPU_NAMES=['','CPU 疾風','CPU 静流','CPU 豪腕'];
const STYLE_NAME={attack:'攻撃型',defense:'守備型',naki:'鳴き型'};
function stopLocalGame(){
  if(human){const h=human;human=null;h(null);}
  clearTimer();gameToken++;G=null;pendingModal=null;
}
function newGame(online,boot){
  if(!boot){gate=Promise.resolve();gateOpen=null;}
  REVIEW=[];
  if(human){const h=human;human=null;h(null);}
  if(NET&&NET.mode==='host')for(const k in NET.pending)NET.pending[k].abort();
  clearTimer();gameToken++;ME=0;
  const styles=['attack','defense','naki'];
  const players=[0,1,2,3].map(i=>{
    const base={id:i,score:25000,hand:[],melds:[],discards:[],ctl:'cpu',style:null,styleName:'',offline:false};
    if(i===0)return{...base,name:online?NET.name:'あなた',ctl:'local'};
    if(online&&NET.seats[i])return{...base,name:NET.seats[i].name||'プレイヤー',ctl:'remote',offline:!NET.seats[i].online};
    const st=styles[i-1];return{...base,name:CPU_NAMES[i],style:st,styleName:STYLE_NAME[st]};
  });
  G={players,round:0,honba:0,sticks:0,startDealer:Math.floor(Math.random()*4),log:[],doraInd:[],uraInd:[],doraCount:1,live:[],allDiscards:[],seq:0,dealer:0,roundWind:27,turn:0,drawn:null,resPub:null,finPub:null,kanCount:0,noCalls:true};
  log(online?'オンライン対局開始！ 空席はCPUが入ります。':'対局開始！ 1局ごとに解説がつきます。ゆっくり考えてOK。',true);

}
async function runGame(tok){
  try{
    while(true){
      const r=await playHand(tok);check(tok);
      const busted=G.players.some(p=>p.score<0);
      if(r.dealerKeeps){G.honba++;}else{G.round++;G.honba=r.draw?G.honba+1:0;}
      if(G.round>=S.length||busted){await showFinal(tok);return;}
    }
  }catch(e){if(e!==ABORT)console.error(e);}
}
function roundName(){return(G.round<4?'東':'南')+(G.round%4+1)+'局';}
async function playHand(tok){
  G.dealer=(G.startDealer+G.round)%4;G.roundWind=G.round<4?27:28;
  const w=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)w.push(t);shuffle(w);
  G.doraInd=w.splice(0,5);G.uraInd=w.splice(0,5);G.rinshan=w.splice(0,4);G.live=w;
  G.kanCount=0;G.doraCount=1;G.noCalls=true;G.allDiscards=[];G.seq=0;G.lastCall=null;G.drawn=null;G.result=null;
  shCache.clear();
  for(const p of G.players){Object.assign(p,{hand:[],melds:[],discards:[],riichi:false,doubleRiichi:false,ippatsu:false,furitenTemp:false,riichiFuriten:false,riichiSeq:-1,folding:false,prompt:null});
    p.seatWind=27+((p.id-G.dealer+4)%4);}
  for(let k=0;k<13;k++)for(let i=0;i<4;i++)G.players[(G.dealer+i)%4].hand.push(G.live.shift());
  log(`── ${roundName()} ${G.honba}本場 開始。親は${G.players[G.dealer].name}。ドラは ${tName(doraOf(G.doraInd[0]))}`,true);
  render();await gate;check(tok);
  let cur=G.dealer,needDraw=true,pre=null;
  while(true){
    const P=G.players[cur];G.turn=cur;let drawn=null,rinshan=false;
    if(pre){drawn=pre;rinshan=true;pre=null;}
    else if(needDraw){if(G.live.length===0)return await exhaustiveDraw(tok);drawn=G.live.shift();P.hand.push(drawn);P.furitenTemp=false;}
    G.drawn=drawn;
    let forbidden=(!needDraw&&G.lastCall&&G.lastCall.by===cur)?G.lastCall.forbid:[];
    let action;
    while(true){
      render();
      action=await askSelf(P,drawn,rinshan,forbidden,tok);
      check(tok);
      if(action.type==='tsumo')return await doWin(tok,cur,null,drawn,true,rinshan);
      if(action.type==='ankan'||action.type==='kakan'){
        const t=action.t;
        if(action.type==='ankan'){for(let k=0;k<4;k++)removeOne(P.hand,t);P.melds.push({type:'ankan',tiles:[t,t,t,t]});}
        else{removeOne(P.hand,t);const m=P.melds.find(m=>m.type==='pon'&&m.tiles[0]===t);m.type='kakan';m.tiles.push(t);}
        G.kanCount++;G.doraCount++;G.noCalls=false;G.players.forEach(q=>q.ippatsu=false);
        log(`${P.name}が ${tName(t)} を${action.type==='ankan'?'暗槓':'加槓'}。新ドラ ${tName(doraOf(G.doraInd[G.doraCount-1]))}`,true);
        drawn=G.rinshan.pop();G.live.pop();P.hand.push(drawn);G.drawn=drawn;rinshan=true;forbidden=[];
        continue;
      }
      break;
    }
    const t=action.t;removeOne(P.hand,t);
    const decl=!!action.riichi;
    if(P.riichi&&!decl)P.ippatsu=false;
    G.seq++;
    P.discards.push({t,riichi:decl,called:false});
    G.allDiscards.push({by:cur,t,seq:G.seq});
    if(decl){P.riichi=true;P.doubleRiichi=G.noCalls&&P.discards.length===1;P.ippatsu=true;P.riichiSeq=G.seq;
      const waits=getWaits(P.hand,P.melds.length);
      log(`${P.name}が${P.doubleRiichi?'ダブル':''}リーチ！ ${(!NET&&P.ctl==='local')?'待ち: '+waits.map(tName).join('・'):'現物（リーチ者の捨て牌）は安全です。手が遠ければオリましょう'}`,true);}
    G.drawn=null;G.lastCall=null;
    render();await sleep(P.ctl==='cpu'?S.speed*0.4:120);check(tok);
    const resp=await collectResponses(tok,cur,t);check(tok);
    if(resp&&resp.type==='ron')return await doWin(tok,resp.by,cur,t,false,false);
    if(decl){P.score-=1000;G.sticks++;}
    if(resp){
      const Q=G.players[resp.by];P.discards[P.discards.length-1].called=true;
      for(const x of resp.use)removeOne(Q.hand,x);
      const kind=resp.type;const tiles=kind==='chi'?sortTiles(resp.use.concat([t])):resp.use.concat([t]);
      Q.melds.push({type:kind,tiles,from:cur,called:t});
      G.noCalls=false;G.players.forEach(q=>q.ippatsu=false);
      const jp={pon:'ポン',chi:'チー',minkan:'カン'}[kind];
      let note='';if(kind!=='chi'&&yakuhaiFor(Q)(t))note='（役牌確定。早い和了に注意）';
      else{const sf=suitFocus(Q);if(sf!==null)note=`（${['萬子','筒子','索子'][sf]}の染め手かも）`;}
      log(`${Q.name}が ${tName(t)} を${jp}${note}`,Q.ctl==='cpu');
      cur=resp.by;
      if(kind==='minkan'){G.kanCount++;G.doraCount++;const d=G.rinshan.pop();G.live.pop();Q.hand.push(d);pre=d;needDraw=false;}
      else{G.lastCall={by:cur,forbid:[t]};needDraw=false;}
      continue;
    }
    cur=(cur+1)%4;needDraw=true;
  }
}
const asCpu=P=>P.ctl==='cpu'||(P.ctl==='remote'&&P.offline);
async function collectResponses(tok,from,t){
  const order=[1,2,3].map(k=>(from+k)%4);
  const canCall=G.live.length>0;
  const callOpts=Q=>{
    if(Q.id===from||Q.riichi||!canCall)return{pon:false,kan:false,chis:[]};
    const c=toCounts(Q.hand);
    return{pon:c[t]>=2,kan:c[t]>=3&&G.kanCount<4,chis:(from+1)%4===Q.id?chiOptions(Q,t):[]};
  };
  const choice={},asked={};
  for(const q of order){const Q=G.players[q];
    const waits=getWaits(Q.hand,Q.melds.length);
    if(!waits.includes(t))continue;
    const fur=isFuriten(Q,waits);let info=null;
    if(!fur){info=evaluateHand(winCtx(Q,t,false,false));if(!info.valid)info=null;}
    if(info){
      if(asCpu(Q))return{type:'ron',by:q};
      asked[q]=true;choice[q]=await askResp(Q,{ron:info,...callOpts(Q)},t,from,tok);check(tok);
      if(choice[q].type==='ron')return{type:'ron',by:q};
    }else if(Q.ctl==='local'&&!NET){log(fur?`${tName(t)} は当たり牌ですが、フリテンなのでロンできません（自分の捨て牌に待ち牌があるか、見逃し直後）`:`${tName(t)} は当たり牌ですが、役がないのでロンできません`,true);}
    if(Q.riichi)Q.riichiFuriten=true;else Q.furitenTemp=true;
  }
  if(!canCall)return null;
  for(const q of order){const Q=G.players[q];if(!asCpu(Q)||Q.riichi)continue;const c=toCounts(Q.hand);
    if(c[t]>=2&&cpuWantsCall(Q,t,'pon',[t,t])){await sleep(S.speed*0.5);return{type:'pon',by:q,use:[t,t]};}}
  const humans=order.filter(q=>{const Q=G.players[q];if(asCpu(Q)||asked[q])return false;const o=callOpts(Q);return o.pon||o.kan||o.chis.length;});
  if(humans.length){const res=await Promise.all(humans.map(q=>askResp(G.players[q],{ron:null,...callOpts(G.players[q])},t,from,tok)));check(tok);humans.forEach((q,i)=>choice[q]=res[i]);}
  for(const q of order){const c=choice[q];if(c&&(c.type==='pon'||c.type==='minkan'))return{...c,by:q};}
  for(const q of order){const c=choice[q];if(c&&c.type==='chi')return{...c,by:q};}
  const nx=(from+1)%4,N=G.players[nx];
  if(asCpu(N)&&!N.riichi){for(const use of chiOptions(N,t)){if(cpuWantsCall(N,t,'chi',use)){await sleep(S.speed*0.5);return{type:'chi',by:nx,use};}}}
  return null;
}
async function cpuSelf(P,drawn,rinshan,forbidden,tok){
  await sleep(S.speed);check(tok);
  if(drawn!==null&&shantenAll(toCounts(P.hand),P.melds.length)===-1){const info=evaluateHand(winCtx(P,drawn,true,rinshan));if(info.valid)return{type:'tsumo'};}
  if(P.riichi)return{type:'discard',t:drawn};
  for(const k of selfKanOptions(P)){
    const c=toCounts(P.hand);const before=shantenAll(c,P.melds.length);c[k.t]-=(k.type==='ankan'?4:1);
    const after=shantenNormal(c,P.melds.length+(k.type==='ankan'?1:0));
    if(after<=before&&!(threatsFor(P).length&&k.type==='kakan'))return k;}
  const ch=chooseDiscard(P,forbidden,P.style);
  if(ch.fold&&!P.folding){P.folding=true;log(`${P.name}は安全牌を選んでいます（オリ気配）`);}
  const ro=riichiOptions(P);
  if(ro.length&&!ch.fold){
    let best=null;const vis=visibleFor(P);
    for(const t of ro){const h=P.hand.slice();removeOne(h,t);const ws=getWaits(h,P.melds.length);
      const n=ws.reduce((a,w)=>a+Math.max(0,4-vis[w]),0);if(!best||n>best.n)best={t,n};}
    if(best.n>0)return{type:'discard',t:best.t,riichi:true};
  }
  return{type:'discard',t:ch.opt.t};
}
async function askSelf(P,drawn,rinshan,forbidden,tok){
  if(asCpu(P))return cpuSelf(P,drawn,rinshan,forbidden,tok);
  let tsumoInfo=null;
  if(drawn!==null&&shantenAll(toCounts(P.hand),P.melds.length)===-1){const i=evaluateHand(winCtx(P,drawn,true,rinshan));if(i.valid)tsumoInfo=i;}
  if(P.riichi&&!tsumoInfo){await sleep(450);return{type:'discard',t:drawn};}
  const adv=buildSelfAdvice(P,drawn,forbidden,tsumoInfo);
  const auto=tsumoInfo?{type:'tsumo'}:{type:'discard',t:adv.rec,riichi:adv.recRiichi};
  const state={kind:'self',drawn,forbidden,tsumoInfo,kans:selfKanOptions(P),riichiTiles:riichiOptions(P)};
  if(P.ctl==='local')return await waitHuman({...state,adv},auto,tok);
  return await waitRemote(P,state,auto,tok);
}
async function askResp(Q,opts,t,from,tok){
  const auto=opts.ron?{type:'ron'}:{type:'pass'};
  if(Q.ctl==='local')return await waitHuman({kind:'resp',t,from,opts,adv:buildRespAdvice(Q,t,from,opts)},auto,tok);
  if(Q.offline)return auto;

// ---------- local input ----------
function startTimer(onTimeout,total){
  clearTimer();timerTotal=total||0;
  if(!timerTotal){renderTimer();return;}
  timerLeft=timerTotal;renderTimer();
  timerId=setInterval(()=>{if(PAUSED)return;timerLeft--;renderTimer();if(timerLeft>0&&timerLeft<=5)sfx('tick');if(timerLeft<=0){clearTimer();onTimeout();}},1000);
}
function clearTimer(){if(timerId){clearInterval(timerId);timerId=null;}timerTotal=0;const r=$('ring');if(r)r.hidden=true;}
function renderTimer(){
  const el=$('timer'),ring=$('ring');const active=!!(G&&G.ui);
  if(!timerTotal||!active){if(ring)ring.hidden=true;if(el){el.textContent=active?'時間無制限':'';el.classList.remove('low');}return;}
  const left=Math.max(0,timerLeft);
  if(el){el.textContent=`残り${left}秒`;el.classList.toggle('low',left<=10);}
  if(ring){ring.hidden=false;ring.style.setProperty('--p',left/timerTotal);ring.classList.toggle('low',left<=10);}
}
function waitHuman(state,auto,tok){
  return new Promise(res=>{
    G.ui={...state,sel:null,riichiMode:false};HOVER=null;
    human=v=>{clearTimer();human=null;if(G)G.ui=null;HOVER=null;res(v===null?auto:v);};
    const aa=window.__autoplay?null:autoAnswer(G.ui);
    if(aa&&aa.type==='pass'){human(aa);return;}
    render();
    if(window.__autoplay){setTimeout(()=>human&&human(auto),0);return;}
    if(aa){setTimeout(()=>human&&act(aa),550);return;}
    voiceAdvice(G.ui);
    if(state.kind==='self'&&!NET&&!lsGet('mj-tut','')&&!TUT.on)setTimeout(()=>{if(G&&G.ui&&!TUT.on)startTutorial();},500);
    startTimer(()=>{if(human){log('時間切れ：プロ推奨の手を自動で選びました');human(auto);}},S.timeLimit);
  });
}

function tone(c,f,t0,dur,type='sine',gain=.15){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);

function clack(c,t0,gain=.5,freq=1800){const len=.07,buf=c.createBuffer(1,Math.floor(c.sampleRate*len),c.sampleRate),d=buf.getChannelData(0);

  const g=c.createGain();g.gain.value=gain;s.connect(f).connect(g).connect(c.destination);s.start(t0);}

function fxCheck(){
  const now=performance.now();
  const hk=`${G.round}-${G.honba}-${G.dealer}`;
  let fresh=false;
  if(hk!==FX.hk){
    const first=FX.hk===null;FX.hk=hk;FX.snap=null;FX.seen.clear();FX.dealAt=now;fresh=true;FX.deltas={};
    if(!G.resPub&&G.players.every(p=>p.discards.length===0)){banner(`${roundName()} ${G.honba}本場`,`親：${G.players[G.dealer].name}`);sfx('deal');}
    else if(first)FX.dealAt=0;
  }
  const snap=G.players.map(P=>({d:P.discards.length,m:P.melds.length,mt:P.melds.reduce((a,m)=>a+m.tiles.length,0),r:P.riichi,s:P.score}));
  let disc=false;
  G.players.forEach((P,i)=>P.discards.forEach((d,j)=>{const key=i+':'+j;if(!FX.seen.has(key)){FX.seen.set(key,FX.snap?now:0);if(FX.snap)disc=true;}}));
  if(FX.snap){
    snap.forEach((s,i)=>{const o=FX.snap[i];if(!o)return;const k=(i-ME+4)%4;const P=G.players[i];
      if(s.m>o.m){const m=P.melds[P.melds.length-1];callout(k,{pon:'ポン',chi:'チー'}[m.type]||'カン',m.type);burst(CALL_POS[k][0],CALL_POS[k][1],12);sfx('call');}
      else if(s.mt>o.mt){callout(k,'カン','kan');burst(CALL_POS[k][0],CALL_POS[k][1],12);sfx('call');}
      if(s.r&&!o.r){cutin('リーチ','riichi',P.name,P.id===ME);sfx('riichi');}
      if(s.s!==o.s){FX.deltas[i]={v:s.s-o.s,until:now+2800};setTimeout(()=>G&&render(),2900);}
    });
    if(disc)sfx('discard');
  }
  FX.snap=snap;
  if(G.turn===ME&&G.drawn!==null){const dk=hk+':'+G.players[ME].discards.length+':'+G.players[ME].melds.length+':'+G.drawn;
    if(dk!==FX.drawKey){FX.drawKey=dk;FX.drawAt=now;if(!fresh)sfx('draw');}}
}

async function doWin(tok,winner,from,t,tsumo,rinshan){
  const W=G.players[winner];
  const info=evaluateHand(winCtx(W,t,tsumo,rinshan));
  const s=info.score;const deltas=[0,0,0,0];const hb=G.honba;
  if(tsumo){for(const q of G.players){if(q.id===winner)continue;
      const pay=(W.id===G.dealer?s.each:(q.id===G.dealer?s.dealerPay:s.otherPay))+hb*100;deltas[q.id]-=pay;deltas[winner]+=pay;}}
  else{const pay=s.ron+hb*300;deltas[from]-=pay;deltas[winner]+=pay;}
  deltas[winner]+=G.sticks*1000;G.sticks=0;
  G.players.forEach(q=>q.score+=deltas[q.id]);
  const handShown=tsumo?W.hand.slice():W.hand.concat([t]);
  log(`${W.name}が${tsumo?'ツモ':G.players[from].name+'からロン'}和了！ ${info.yaku.map(y=>y.name).join('・')} ${s.total}点`,true);
  const res={id:++RESID,W:winner,from,t,tsumo,yaku:info.yaku,han:info.han,fu:info.fu,ym:info.ym,total:s.total,label:s.label,
    deltas,scores:G.players.map(p=>p.score),names:G.players.map(p=>p.name),
    hands:G.players.map((p,i)=>hs(sortTiles(i===winner?handShown:p.hand))),
    melds:G.players.map(p=>p.melds.map(m=>({type:m.type,tiles:hs(m.tiles)}))),
    ura:W.riichi?hs(G.uraInd.slice(0,G.doraCount)):'',riichiW:W.riichi,fromRiichi:false};
  await showResult(res,tok);check(tok);
  return{dealerKeeps:winner===G.dealer};
}
async function exhaustiveDraw(tok){
  const ten=G.players.map(p=>shantenAll(toCounts(p.hand),p.melds.length)===0);

}
