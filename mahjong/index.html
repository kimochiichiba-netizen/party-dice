// ================= ONLINE (passphrase rooms) =================
// The host's browser runs the game. Everyone shares one named room derived from the passphrase.
// Each player's hand and prompts travel encrypted (ECDH P-256 + AES-GCM) so only that player can read them.
const KEYS={kp:null,pub:'',ok:false};
const b64=u=>{let s='';for(const x of u)s+=String.fromCharCode(x);return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ensureKeys(){
  if(KEYS.pub)return;
  try{KEYS.kp=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
    KEYS.pub=b64(new Uint8Array(await crypto.subtle.exportKey('raw',KEYS.kp.publicKey)));KEYS.ok=true;}
  catch(e){KEYS.ok=false;KEYS.pub='none';}
}
async function deriveKey(pk){
  if(!KEYS.ok||!pk||pk==='none')return'plain';
  try{const pub=await crypto.subtle.importKey('raw',unb64(pk),{name:'ECDH',namedCurve:'P-256'},false,[]);
    return await crypto.subtle.deriveKey({name:'ECDH',public:pub},KEYS.kp.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
  catch(e){return'plain';}
}
async function encJ(key,obj){
  const txt=JSON.stringify(obj);if(key==='plain')return'p'+txt;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt)));
  return'e'+b64(iv)+'.'+b64(ct);
}
async function decJ(key,s){
  if(typeof s!=='string'||!key)return null;
  if(s[0]==='p')return JSON.parse(s.slice(1));
  if(key==='plain')return null;
  const [a,b]=s.slice(1).split('.');
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(a)},key,unb64(b));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function roomNameFor(code){
  const norm=code.normalize('NFKC').trim().toLowerCase();
  try{const d=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mahjong-dojo:'+norm)));return'mj-'+[...d].slice(0,16).map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h1=0x811c9dc5,h2=0x1234567;for(const ch of norm){const c=ch.codePointAt(0);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2+c,2246822519)>>>0;}return'mj-'+h1.toString(16)+h2.toString(16);}
}
// ---- direct connection (WebRTC via PeerJS) used when the page runs outside Claude ----
// Exposes the same calls the rest of the code uses on a room: presence, peers, onPeers, onConnection, connected, leave.
function loadScript(src){return new Promise((res,rej)=>{if(window.Peer)return res();const s=document.createElement('script');s.src=src;s.onload=()=>window.Peer?res():rej(new Error('noPeer'));s.onerror=()=>rej(new Error('load'));document.head.appendChild(s);});}
const peerOpts=()=>window.__peerOpts||{debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
function mergeP(o,patch){const n={...o};for(const k in patch){if(patch[k]===null)delete n[k];else n[k]=patch[k];}return n;}
async function p2pRoom(rn,asHost){
  await loadScript('peerjs.min.js');
  const hostId='mjdojo-'+rn.replace(/^mj-/,'');
  let me=null,presence={},list=[],connected=false;const H={peers:[],conn:[]};
  const mk=(id,pres)=>Object.freeze({peer:id,presence:pres||{},sameTab:id===me,isMe:id===me,kind:'viewer',by:null,guest:false,updatedAt:Date.now()});
  const notify=()=>{const ch={peers:list,joined:[],left:[],updated:[]};H.peers.slice().forEach(h=>{try{h(ch);}catch(e){console.warn(e);}});};
  const setConn=c=>{connected=c;H.conn.slice().forEach(h=>{try{h(c);}catch(e){}});};
  const openPeer=id=>new Promise((res,rej)=>{const p=id?new Peer(id,peerOpts()):new Peer(peerOpts());
    const fail=e=>rej(e);p.once('open',x=>{me=x;p.off('error',fail);res(p);});p.once('error',fail);});
  const api=extra=>({p2p:true,...extra,peers:()=>list,connected:()=>connected,
    onPeers:h=>{H.peers.push(h);setTimeout(()=>h({peers:list,joined:[],left:[],updated:[]}),0);return()=>{H.peers=H.peers.filter(x=>x!==h);};},
    onConnection:h=>{H.conn.push(h);setTimeout(()=>h(connected),0);return()=>{H.conn=H.conn.filter(x=>x!==h);};}});
  if(asHost){
    const peer=await openPeer(hostId);const clients=new Map();
    const rebuild=()=>{list=[mk(me,presence),...[...clients].map(([id,c])=>mk(id,c.presence))];
      const msg={t:'peers',list:list.map(p=>({peer:p.peer,presence:p.presence}))};
      for(const [,c] of clients)if(c.conn.open){try{c.conn.send(msg);}catch(e){}}notify();};
    peer.on('connection',conn=>{
      conn.on('open',()=>{if(clients.size>=8){conn.close();return;}clients.set(conn.peer,{conn,presence:{}});rebuild();});
      conn.on('data',d=>{const c=clients.get(conn.peer);if(c&&d&&d.t==='presence'&&d.patch&&typeof d.patch==='object'){c.presence=mergeP(c.presence,d.patch);

      const drop=()=>{if(clients.delete(conn.peer))rebuild();};conn.on('close',drop);conn.on('error',drop);
    });

    peer.on('error',e=>console.warn('peer',e&&e.type));

    return api({presence:async patch=>{presence=mergeP(presence,patch);rebuild();},leave:async()=>{try{peer.destroy();}catch(e){}}});
  }
  const peer=await openPeer(null);let conn=null,retryT=null,dead=false;
  list=[mk(me,presence)];
  const connect=()=>new Promise((res,rej)=>{
    if(dead)return rej(new Error('left'));
    conn=peer.connect(hostId,{reliable:true});const c=conn;
    const to=setTimeout(()=>{try{c.close();}catch(e){}rej(new Error('no_host'));},8000);
    c.on('open',()=>{clearTimeout(to);setConn(true);try{c.send({t:'presence',patch:presence});}catch(e){}res();});
    c.on('data',d=>{if(d&&d.t==='peers'&&Array.isArray(d.list)){list=d.list.slice(0,16).map(x=>mk(String(x.peer),x.presence&&typeof x.presence==='object'?x.presence:{}));
      if(!list.some(p=>p.peer===me))list.push(mk(me,presence));notify();}});
    c.on('close',()=>{if(conn!==c)return;setConn(false);list=[mk(me,presence)];notify();retry();});
    c.on('error',()=>{});
  });
  const retry=()=>{if(dead||retryT)return;retryT=setTimeout(()=>{retryT=null;connect().catch(()=>retry());},2500);};
  peer.on('error',e=>{if(e&&e.type==='peer-unavailable')return;console.warn('peer',e&&e.type);});
  peer.on('disconnected',()=>{try{if(!dead)peer.reconnect();}catch(e){}});
  connect().catch(()=>retry());
  return api({presence:async patch=>{presence=mergeP(presence,patch);list=list.map(p=>p.peer===me?mk(me,presence):p);if(conn&&conn.open){try{conn.send({t:'presence',patch});}catch(e){}}},
    leave:async()=>{dead=true;clearTimeout(retryT);try{peer.destroy();}catch(e){}}});
}
let ROOM=null;
// Fallback when named rooms are not available: use the main room and keep only peers that carry the same key.
function lobbyScoped(room,rk){
  const mine=p=>p.sameTab||(p.presence&&p.presence.rk===rk);
  const FIELDS=['rk','role','tok','n','pk','act','hp','v','lobby','g','pv','stamp'];
  return{lobbyMode:true,
    presence:patch=>room.presence({...patch,rk}),
    peers:()=>room.peers().filter(mine),
    onPeers:(h,e)=>room.onPeers(ch=>h({peers:ch.peers.filter(mine),joined:ch.joined.filter(mine),left:ch.left,updated:ch.updated.filter(mine)}),e),
    onConnection:(h,e)=>room.onConnection(h,e),
    connected:()=>room.connected(),
    leave:()=>{const clear={};for(const f of FIELDS)clear[f]=null;return room.presence(clear);}};
}

  NET.answered=pid;NET.ui=null;human=null;clearTimer();if(G)G.ui=null;render();
  try{const payload=await encJ(NET.hostKey,{pid,a});await NET.R.presence({act:payload});}catch(e){console.warn('act',e);}
}

// ================= REVIEW (振り返り) =================
let REVIEW=[];
function recordDecision(v){
  try{
    const ui=G&&G.ui;if(!ui||!ui.adv||!v)return;const P=G.players[ME];
    const where=`${roundName()} ${P.discards.length+1}巡目`;
    if(ui.kind==='self'){
      if(v.type!=='discard')return;
      const A=analyzeDiscards(P,ui.forbidden).opts;
      const pick=t=>{const o=A.find(x=>x.t===t);return o?{sh:o.shanten,uk:o.ukeire,dl:ui.adv.threats.length?dangerLevel(o.danger):-1,why:o.why||''}:null;};
      REVIEW.push({kind:'self',where,hand:hs(sortTiles(P.hand)),chosen:v.t,rec:ui.adv.rec,rcR:!!ui.adv.recRiichi,chR:!!v.riichi,
        ch:pick(v.t),rc:pick(ui.adv.rec),fold:!!ui.adv.fold,threat:ui.adv.threats.length>0});
    }else{
      const rec=ui.adv.rec==='ron'?'ron':ui.adv.rec==='pass'?'pass':ui.adv.rec.kind;
      REVIEW.push({kind:'resp',where,t:ui.t,chosen:v.type,rec,adv:ui.adv.html,hand:hs(sortTiles(P.hand))});
    }
  }catch(e){console.warn('review',e);}
}
const ACT_JP={pass:'スルー',pon:'ポン',chi:'チー',minkan:'カン',ron:'ロン'};
function reviewItems(){
  return REVIEW.map(r=>{
    if(r.kind==='resp'){const ok=r.chosen===r.rec;return{...r,ok,sev:ok?0:(r.rec==='ron'?60:25)};}
    let ok=r.chosen===r.rec&&r.chR===r.rcR;
    if(!ok&&r.ch&&r.rc&&r.ch.sh===r.rc.sh&&r.ch.uk===r.rc.uk&&r.ch.dl===r.rc.dl&&r.chR===r.rcR)ok=true; // equivalent choice
    let sev=0;
    if(!ok&&r.fold&&r.ch&&r.rc){if(r.ch.dl<=r.rc.dl)ok=true;else sev=(r.ch.dl-r.rc.dl)*15+5;}
    else if(!ok&&r.ch&&r.rc){sev+=Math.max(0,r.ch.sh-r.rc.sh)*25+Math.max(0,r.rc.uk-r.ch.uk)+Math.max(0,r.ch.dl-r.rc.dl)*12;if(r.chR!==r.rcR)sev+=10;}
    return{...r,ok,sev};
  });
}
function reviewHTML(){
  const items=reviewItems();
  if(!items.length)return`<h2>振り返り</h2><p class="note">まだ記録がありません。対局で自分の番を打つと、プロの推奨と比べた振り返りがここに出ます（アシストがオフでも記録されます）。</p><p><button class="btn primary" id="closeReview">閉じる</button></p>`;
  const ok=items.filter(x=>x.ok).length,rate=Math.round(100*ok/items.length);
  const miss=items.filter(x=>!x.ok).sort((a,b)=>b.sev-a.sev).slice(0,6);
  const grade=rate>=90?'プロ級！':rate>=75?'上級者の打ち方':rate>=55?'中級者。あと一歩':'伸びしろ大。解説を見ながら打ってみよう';
  let h=`<h2>振り返り</h2><p>プロ推奨との一致率 <span class="big-score">${rate}%</span> <span class="note">（${ok}/${items.length}手）${grade}</span></p>`;
  const selfMiss=items.filter(x=>x.kind==='self'&&!x.ok);
  const slow=selfMiss.filter(x=>x.ch&&x.rc&&x.ch.sh>x.rc.sh).length,deal=selfMiss.filter(x=>x.ch&&x.rc&&x.ch.dl>x.rc.dl&&x.ch.dl>=2).length,callMiss=items.filter(x=>x.kind==='resp'&&!x.ok).length;
  const tips=[];
  if(slow)tips.push(`手が遅くなる（向聴数が戻る）打牌が${slow}回。まずは「向聴数を下げる」切り方を優先しよう。`);
  if(deal)tips.push(`相手の攻撃中に危険度の高い牌を${deal}回切りました。手が遠い時は現物・筋を選ぶ練習を。`);
  if(callMiss)tips.push(`鳴き・ロンの判断で推奨と違う選択が${callMiss}回。「鳴いた後に役があるか」を毎回確認しよう。`);
  if(!tips.length)tips.push('大きなミスはありません。受け入れ枚数の細かい差まで意識すると、さらに強くなれます。');
  h+=`<div class="tip">${tips.join('<br>')}</div>`;
  if(miss.length){h+=`<h3>見直したい場面（影響が大きい順）</h3><div class="rv">`;
    for(const r of miss){
      if(r.kind==='self'){
        const hand=unhs(r.hand);
        const why=[];
        if(r.ch&&r.rc&&r.fold){
          why.push(`手が遠く相手が攻めていたので、プロはオリ（守備）を選ぶ場面でした。${tName(r.chosen)}は「${LV_NAME[Math.max(0,r.ch.dl)]}」（${esc(r.ch.why)}）、プロの${tName(r.rec)}は「${LV_NAME[Math.max(0,r.rc.dl)]}」${r.rc.why?'（'+esc(r.rc.why)+'）':''}。`);
        }else if(r.ch&&r.rc){
          if(r.ch.sh>r.rc.sh)why.push(`${tName(r.chosen)}を切ると${shText(r.ch.sh)}に戻り、手が遅くなります。`);
          else if(r.rc.uk>r.ch.uk)why.push(`受け入れが<b>${r.rc.uk-r.ch.uk}枚少ない</b>選択でした（あなた${r.ch.uk}枚／プロ${r.rc.uk}枚）。`);
          if(r.ch.dl>r.rc.dl)why.push(`相手の攻撃に対して${tName(r.chosen)}は「${LV_NAME[r.ch.dl]}」（${esc(r.ch.why)}）。プロの${tName(r.rec)}は「${LV_NAME[Math.max(0,r.rc.dl)]}」でした。`);
          if(r.rcR&&!r.chR)why.push('テンパイだったので、リーチで打点と一発・裏ドラを狙う場面でした。');
          if(!r.rcR&&r.chR)why.push('このリーチは待ちが少ない／フリテンなどで推奨されない形でした。');
        }
        h+=`<div class="rv-item"><div class="rv-head"><b>${r.where}</b><span class="tag hot">あなた：${tn(r.chosen)}${r.chR?' リーチ':''}</span><span class="tag gold">プロ：${tn(r.rec)}${r.rcR?' リーチ':''}</span></div>
          <div class="ex">${hand.map(t=>tileHTML(t,t===r.chosen?'mark-bad':t===r.rec?'mark-good':'')).join('')}</div><div class="note">${why.join(' ')||'わずかな差です。'}</div></div>`;
      }else{
        h+=`<div class="rv-item"><div class="rv-head"><b>${r.where}</b>${tn(r.t)}が出た場面 <span class="tag hot">あなた：${ACT_JP[r.chosen]||r.chosen}</span><span class="tag gold">プロ：${ACT_JP[r.rec]||r.rec}</span></div>
          <div class="ex">${tilesHTML(unhs(r.hand))}</div><div class="note">${r.adv}</div></div>`;
      }
    }
    h+='</div>';}
  h+=`<p style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="closeReview">閉じる</button><button class="btn" data-open="drill">何切る練習をする</button></p>`;
  return h;
}
function showReview(){
  openModal(reviewHTML());$('closeReview').onclick=closeOrRestore;
  if(S.voice!=='off'){const it=reviewItems();if(it.length){const ok=it.filter(x=>x.ok).length;sayNow(`プロ推奨との一致率は${Math.round(100*ok/it.length)}パーセントです。`);}}
}

// ================= DRILL (何切る練習) =================
const DRILL={n:0,ok:0,streak:0,best:0,cur:null};
try{Object.assign(DRILL,JSON.parse(localStorage.getItem('mj-drill')||'{}'),{cur:null});}catch(e){}
const saveDrill=()=>{try{localStorage.setItem('mj-drill',JSON.stringify({n:DRILL.n,ok:DRILL.ok,best:DRILL.best}));}catch(e){}};
function drillNew(){
  let hand,sh;
  for(let k=0;k<500;k++){const w=[];for(let t=0;t<34;t++)for(let j=0;j<4;j++)w.push(t);shuffle(w);hand=sortTiles(w.slice(0,14));sh=shantenAll(toCounts(hand),0);if(sh>=1&&sh<=2)break;}
  const c=toCounts(hand),vis=toCounts(hand),opts=[];
  for(const t of new Set(hand)){c[t]--;const s=shantenAll(c,0);const uk=ukeire(c,0,s,vis);c[t]++;
    let reason;if(t>=27&&c[t]===1)reason='孤立した字牌';else if(t<27&&(t%9===0||t%9===8)&&c[t]===1)reason='孤立した端牌';else reason='';
    opts.push({t,sh:s,uk:uk.count,tiles:uk.tiles,reason});}
  opts.sort((a,b)=>a.sh-b.sh||b.uk-a.uk);
  DRILL.cur={hand,opts,answered:null};
}
function drillHTML(){
  const D=DRILL.cur;const best=D.opts[0];
  const isBest=o=>o.sh===best.sh&&o.uk===best.uk;
  let h=`<h2>何切る練習</h2><p class="note">14枚の手牌から1枚切ります。<b>向聴数</b>が進み、<b>受け入れ枚数</b>が最も多くなる牌はどれ？（ドラ・場況なし）</p>
  <p class="drill-stats">${DRILL.n}問中 <b>${DRILL.ok}</b>問正解・連続正解 <b>${DRILL.streak}</b>（最高 ${DRILL.best}）</p>
  <div class="drill-hand" id="drillHand">${D.hand.map((t,i)=>tileHTML(t,(D.answered!==null?(t===D.answered&&!isBest(D.opts.find(o=>o.t===t))?'mark-bad ':'')+(isBest(D.opts.find(o=>o.t===t))?'mark-good ':''):'can '),`data-dt="${t}" role="button" tabindex="0"`)).join('')}</div>`;
  if(D.answered===null){h+=`<p class="note">今の手は${shText(shantenAll(toCounts(D.hand),0))}（1枚切った後の最善）。牌をタップして答えましょう。</p><p style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="drillHint">ヒント</button><button class="btn" id="drillSkip">別の問題</button><button class="btn" id="drillClose">閉じる</button></p><p class="note" id="drillHintText"></p>`;}
  else{
    const mine=D.opts.find(o=>o.t===D.answered);const good=isBest(mine);
    const bests=D.opts.filter(isBest);
    h+=`<p class="advice-main">${good?'<strong>正解！</strong>':'<strong>惜しい！</strong>'} 正解は ${bests.map(o=>tn(o.t)).join('')}。切ると${shText(best.sh)}、有効牌 <b>${best.tiles.length}種${best.uk}枚</b>：${best.tiles.map(tn).join('')}${best.reason?`（${best.reason}を切るのが基本）`:''}</p>`;
    if(!good)h+=`<p class="note">あなたの ${tn(mine.t)} は${shText(mine.sh)}・有効牌${mine.uk}枚。${mine.sh>best.sh?'向聴数が戻ってしまいます。':`受け入れが${best.uk-mine.uk}枚少なくなります。`}</p>`;
    h+=`<div class="cand">${D.opts.slice(0,6).map(o=>`<span>${tn(o.t)}</span><span>${shText(o.sh)}・有効牌${o.uk}枚</span><span class="lv ${isBest(o)?'l0':o.sh>best.sh?'l3':'l2'}">${isBest(o)?'最善':o.sh>best.sh?'後退':'−'+(best.uk-o.uk)+'枚'}</span>`).join('')}</div>`;
    h+=`<p style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn primary" id="drillNext">次の問題</button><button class="btn" id="drillClose">閉じる</button></p>`;
  }
  return h;
}
function showDrill(keep){
  if(!keep&&(!DRILL.cur||DRILL.cur.answered!==null))drillNew();
  openModal(drillHTML());
  const sheet=$('sheet');
  const pick=t=>{const D=DRILL.cur;if(D.answered!==null)return;D.answered=t;const best=D.opts[0];const mine=D.opts.find(o=>o.t===t);const good=mine.sh===best.sh&&mine.uk===best.uk;
    DRILL.n++;if(good){DRILL.ok++;DRILL.streak++;DRILL.best=Math.max(DRILL.best,DRILL.streak);}else DRILL.streak=0;saveDrill();showDrill(true);
    if(S.voice!=='off')sayNow(toSpeech(good?`正解！ ${tName(t)}切りで有効牌${best.uk}枚です。`:`惜しい。正解は${tName(best.t)}。有効牌${best.uk}枚、あなたの${tName(t)}は${mine.uk}枚でした。`));};
  sheet.querySelectorAll('[data-dt]').forEach(el=>{el.onclick=()=>pick(+el.dataset.dt);el.onkeydown=e=>{if(e.key==='Enter')pick(+el.dataset.dt);};});
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f;};
  on('drillNext',()=>{drillNew();showDrill();});
  on('drillSkip',()=>{drillNew();showDrill();});
  on('drillClose',()=>closeOrRestore());
  on('drillHint',()=>{const D=DRILL.cur;const iso=D.opts.filter(o=>o.reason);$('drillHintText').innerHTML=iso.length?`ヒント：${iso.map(o=>o.reason).filter((v,i,a)=>a.indexOf(v)===i).join('・')}がありますか？ 面子になりにくい牌から考えよう。`:'ヒント：孤立牌はありません。どの形を残すと次に来る牌の種類が一番多いか数えてみよう。';});
}

// ================= STAMPS (online reactions) =================
const STAMPS=['よろしく！','ナイス！','うわー','考え中…','ありがとう','おつかれさま'];
const stampSeen={};
function sendStamp(k){
  if(!NET)return;const id=Date.now();
  NET.R.presence({stamp:{i:id,k}}).catch(()=>{});
  showToast(`${NET.name}：${STAMPS[k]}`);
}
function handleStamps(peers){
  for(const p of peers){if(p.sameTab||p.kind!=='viewer')continue;const st=p.presence&&p.presence.stamp;
    if(!(p.peer in stampSeen)){stampSeen[p.peer]=st&&typeof st.i==='number'?st.i:0;continue;} // a stamp already there on first sight is old
    if(!st||typeof st.i!=='number'||!Number.isInteger(st.k)||!STAMPS[st.k])continue;
    if(st.i===stampSeen[p.peer])continue;stampSeen[p.peer]=st.i;
    const nm=p.presence.role==='host'?(p.presence.lobby&&p.presence.lobby.seats&&p.presence.lobby.seats[0]&&p.presence.lobby.seats[0].n):p.presence.n;
    const msg=`${cleanName(nm)}：${STAMPS[st.k]}`;showToast(msg);if(S.voice==='all')sayEvent(msg.replace('：','、'));}
}
setInterval(()=>{if(NET&&NET.R)try{handleStamps(NET.R.peers());}catch(e){}},500);
let toastTimer=null;
function showToast(msg){const t=$('toast');if(!t)return;t.textContent=msg;t.hidden=false;t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},2600);}
function renderStamps(){const el=$('stamps');if(!el)return;const on=!!NET;el.hidden=!on;if(on&&!el.dataset.built){el.dataset.built='1';el.innerHTML='<span class="note">スタンプ</span>'+STAMPS.map((s,i)=>`<button class="btn mini" data-stamp="${i}">${s}</button>`).join('');}}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-stamp]');if(s){sendStamp(+s.dataset.stamp);return;}
  const o=e.target.closest('[data-open]');if(o){if(o.dataset.open==='drill')showDrill();else if(o.dataset.open==='review')showReview();}
});
$('btnReview').onclick=()=>showReview();
$('btnDrill').onclick=()=>showDrill();

}

// ---- auto answers (自動和了・鳴きなし) ----
function autoAnswer(ui){
  if(!ui)return null;
  if(S.autoWin){if(ui.kind==='self'&&ui.tsumoInfo)return{type:'tsumo'};if(ui.kind==='resp'&&ui.opts.ron)return{type:'ron'};}
  if(S.noCall&&ui.kind==='resp'&&!ui.opts.ron)return{type:'pass'};
  return null;
}

// ---- selection, preview, waits ----
function selectTile(el){
  const ui=G&&G.ui;if(!ui||!el)return;
  ui.sel=el.dataset.key;document.querySelectorAll('#hand .tile.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
  sfx('tap');showPreview(+el.dataset.t);renderCoach();
}
function previewText(t){
  const ui=G&&G.ui;if(!ui||ui.kind!=='self'||S.assist==='off')return'';
  const P=G.players[ME];ui.optsCache=ui.optsCache||analyzeDiscards(P,ui.forbidden).opts;
  const o=ui.optsCache.find(x=>x.t===t);if(!o)return'';
  let s=`${tn(t)} を切ると <b>${shText(o.shanten)}</b>`;
  if(o.shanten===0){const h=P.hand.slice();removeOne(h,t);const vis=visibleFor(P);const ws=getWaits(h,P.melds.length);
    s+=ws.length?`　待ち ${ws.map(w=>`<span class="wt">${tn(w)}<sub>残${Math.max(0,4-vis[w])}</sub></span>`).join('')}`:'（待ちなし）';}
  else s+=`・有効牌 <b>${o.ukeire}</b>枚`;
  if(ui.adv&&ui.adv.threats.length)s+=`　<span class="lv l${dangerLevel(o.danger)}">${LV_NAME[dangerLevel(o.danger)]}</span>`;
  return s;
}
let HOVER=null;
function showPreview(t){HOVER=t;updatePreview();}
function updatePreview(){
  const el=$('preview');if(!el)return;let html='';
  if(G){const ui=G.ui;const me=G.players[ME];
    if(ui&&ui.kind==='self'&&HOVER!=null)html=previewText(HOVER);
    else if(!ui&&me&&me.hand.length%3===1&&!G.resPub&&S.assist!=='off'&&shantenAll(toCounts(me.hand),me.melds.length)===0){
      const vis=visibleFor(me);const ws=getWaits(me.hand,me.melds.length);const fur=ws.some(w=>me.discards.some(d=>d.t===w));
      html=`<span class="tenpai">テンパイ中</span> 待ち ${ws.map(w=>`<span class="wt">${tn(w)}<sub>残${Math.max(0,4-vis[w])}</sub></span>`).join('')}${fur?' <span class="lv l3">フリテン（ロン不可）</span>':''}`;}
  }
  if(el.__h!==html){el.__h=html;el.innerHTML=html;}el.classList.toggle('show',!!html);
}
$('hand').addEventListener('mouseover',e=>{const t=e.target.closest('.tile');if(!t||!(G&&G.ui&&G.ui.kind==='self'))return;if(G.ui.sel==null)showPreview(+t.dataset.t);});
$('hand').addEventListener('mouseleave',()=>{const ui=G&&G.ui;HOVER=ui&&ui.sel!=null?selTile():null;updatePreview();});

// ---- drag / swipe up to discard ----
let DRAG=null,dragBlockClick=false;
$('hand').addEventListener('pointerdown',e=>{const t=e.target.closest('.tile.can');const ui=G&&G.ui;if(!t||!ui||ui.kind!=='self'||!human)return;DRAG={el:t,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};});
window.addEventListener('pointermove',e=>{
  if(!DRAG||e.pointerId!==DRAG.id)return;const dx=e.clientX-DRAG.x,dy=e.clientY-DRAG.y;
  if(!DRAG.moved&&Math.abs(dy)<8&&Math.abs(dx)<8)return;
  if(!DRAG.moved){DRAG.moved=true;DRAG.el.classList.add('dragging');showPreview(+DRAG.el.dataset.t);}
  DRAG.el.style.transform=`translate(${dx}px,${Math.min(0,dy)}px) scale(1.1)`;DRAG.el.classList.toggle('will-drop',dy<-50);
});
function endDrag(e,cancel){
  if(!DRAG||e.pointerId!==DRAG.id)return;const d=DRAG;DRAG=null;if(!d.moved)return;
  dragBlockClick=true;setTimeout(()=>dragBlockClick=false,60);
  const dy=e.clientY-d.y;d.el.style.transform='';d.el.classList.remove('dragging','will-drop');
  const ui=G&&G.ui;if(!cancel&&dy<-50&&ui&&human&&ui.kind==='self')act({type:'discard',t:+d.el.dataset.t,riichi:ui.riichiMode});
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));

// ---- keyboard ----
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,select,textarea'))return;
  if(e.key==='Escape'&&!$('drawer').hidden){closeDrawer();return;}
  if(!$('modal').hidden||!$('drawer').hidden||TUT.on||PAUSED)return;
  const ui=G&&G.ui;if(!ui||!human)return;const k=e.key.toLowerCase();
  if(ui.kind==='self'){
    const tiles=[...document.querySelectorAll('#hand .tile.can')];
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();if(!tiles.length)return;let i=tiles.findIndex(x=>x.dataset.key===ui.sel);
      i=i<0?(e.key==='ArrowLeft'?tiles.length-1:0):Math.max(0,Math.min(tiles.length-1,i+(e.key==='ArrowLeft'?-1:1)));selectTile(tiles[i]);return;}
    if(e.key==='Enter'||e.key===' '){if(e.target.closest&&e.target.closest('#hand .tile,button'))return;e.preventDefault();
      const el=tiles.find(x=>x.dataset.key===ui.sel);if(el)act({type:'discard',t:+el.dataset.t,riichi:ui.riichiMode});else{const r=document.querySelector('#hand .tile.rec.can')||tiles[tiles.length-1];r&&selectTile(r);}return;}
    if(k==='r'&&ui.riichiTiles.length){ui.riichiMode=!ui.riichiMode;ui.sel=null;render();return;}
    if(k==='t'&&ui.tsumoInfo)return act({type:'tsumo'});
    if(k==='k'&&ui.kans.length)return act({type:ui.kans[0].type,t:ui.kans[0].t});
  }else{
    if(k==='t'&&ui.opts.ron)return act({type:'ron'});
    if(k==='p'&&ui.opts.pon)return act({type:'pon',use:[ui.t,ui.t]});
    if(k==='c'&&ui.opts.chis.length)return act({type:'chi',use:ui.opts.chis[0]});
    if(k==='k'&&ui.opts.kan)return act({type:'minkan',use:[ui.t,ui.t,ui.t]});
    if(e.key==='Escape'||k==='n')return act({type:'pass'});
  }
});

// ---- quick toggles in the action area ----
document.addEventListener('click',e=>{const c=e.target.closest('[data-chip]');if(!c)return;const k=c.dataset.chip;S[k]=!S[k];saveS();sfx('tap');
  if(G&&G.ui){const aa=autoAnswer(G.ui);if(aa&&human){act(aa);return;}}if(G)render();});
function chipsHTML(){return`<span class="chips"><button type="button" class="chip ${S.autoWin?'on':''}" data-chip="autoWin" aria-pressed="${!!S.autoWin}">自動和了</button><button type="button" class="chip ${S.noCall?'on':''}" data-chip="noCall" aria-pressed="${!!S.noCall}">鳴きなし</button></span>`;}

// ---- pause ----
function setPause(v){
  PAUSED=!!v;$('pauseOverlay').hidden=!PAUSED||TUT.on;renderPauseBtn();
  if(PAUSED)stopVoice();
}
function renderPauseBtn(){const b=$('btnPause');if(!b)return;b.hidden=!(G&&!NET&&!gateOpen&&!G.finPub);b.querySelector('.lbl').textContent=PAUSED&&!TUT.on?'再開':'一時停止';b.classList.toggle('on',PAUSED&&!TUT.on);}
$('btnPause').onclick=()=>setPause(!PAUSED);
$('btnResume').onclick=()=>setPause(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!NET&&G.ui&&!PAUSED&&!window.__autoplay)setPause(true);});

// ---- menu drawer ----
function openDrawer(){$('drawer').hidden=false;requestAnimationFrame(()=>$('drawer').classList.add('open'));const f=$('drawer').querySelector('.dl');f&&f.focus();}
function closeDrawer(){$('drawer').classList.remove('open');setTimeout(()=>{$('drawer').hidden=true;},180);}
$('btnMenu').onclick=openDrawer;$('drawerClose').onclick=closeDrawer;
$('drawer').addEventListener('click',e=>{if(e.target.id==='drawer'||e.target.closest('.dl'))closeDrawer();});
$('btnSettings').onclick=()=>showSettings();
$('btnGuide').onclick=()=>{closeModal();if(G&&G.ui&&G.ui.kind==='self')startTutorial();else showGuideCard();};

// ---- coach tabs ----
function setCoachTab(tab){S.coachTab=tab;saveS();document.querySelectorAll('.ctabs [data-tab]').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));});
  document.querySelectorAll('.cpanel').forEach(p=>p.hidden=p.dataset.panel!==tab);}
document.querySelectorAll('.ctabs [data-tab]').forEach(b=>b.onclick=()=>{sfx('tap');setCoachTab(b.dataset.tab);});
setCoachTab(S.coachTab||'advice');

// ---- first-time walkthrough ----
const TUT={on:false,i:0};
const TUT_STEPS=[
  {sel:'#hand',title:'あなたの手牌',text:'牌をタップすると持ち上がり、もう一度タップで捨てます。上にスワイプ（ドラッグ）しても捨てられます。'},
  {sel:'#hand .tile.rec',alt:'#hand',title:'プロのおすすめ',text:'金色の「推奨」がプロのおすすめの1枚。相手がリーチすると、牌の下に危険度のバー（緑＝安全、赤＝危険）が出ます。'},
  {sel:'#actions',title:'プロの一言とボタン',text:'ここにプロの一言と、リーチ・ポン・ロンなどのボタンが出ます。「推奨」の付いたボタンがプロの判断です。'},
  {sel:'.compass',title:'卓の中央',text:'局・残り牌数・ドラを表示します。光っている辺が今の手番、外側のリングはあなたの持ち時間です。'},
  {sel:'#coach',title:'くわしい解説',text:'理由のくわしい解説、相手の読み、狙える役はここ。「読み上げ」で音声でも聞けます。右上のメニューからいつでもこの案内を見直せます。'}
];
function startTutorial(){TUT.on=true;TUT.i=0;PAUSED=true;renderPauseBtn();showTutStep();}
function endTutorial(){TUT.on=false;lsSet('mj-tut','1');const t=$('tut');if(t)t.remove();setPause(false);}
function showTutStep(){
  const st=TUT_STEPS[TUT.i];let el=document.querySelector(st.sel)||document.querySelector(st.alt||'body');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(()=>{
    if(!TUT.on)return;let ov=$('tut');if(!ov){ov=document.createElement('div');ov.id='tut';ov.className='tut';document.body.appendChild(ov);}
    const r=el.getBoundingClientRect();const pad=8;
    const below=r.bottom+200<innerHeight;
    ov.innerHTML=`<div class="tut-hole" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>
      <div class="tut-card" role="dialog" aria-label="${st.title}" style="${below?`top:${Math.min(innerHeight-190,r.bottom+14)}px`:`top:${Math.max(10,r.top-200)}px`}">
      <small>${TUT.i+1} / ${TUT_STEPS.length}</small><b>${st.title}</b><p>${st.text}</p>
      <div class="tut-btns"><button class="btn" id="tutSkip">スキップ</button><button class="btn primary" id="tutNext">${TUT.i===TUT_STEPS.length-1?'はじめる':'次へ'}</button></div></div>`;
    $('tutSkip').onclick=endTutorial;
    $('tutNext').onclick=()=>{TUT.i++;if(TUT.i>=TUT_STEPS.length)endTutorial();else showTutStep();};
    $('tutNext').focus();
  },320);
}
function showGuideCard(){
  openModal(`<h2>操作ガイド</h2>
  <div class="guide-list">
    <div><b>牌を捨てる</b><p>タップで選ぶ → もう一度タップ。または牌を上にスワイプ。</p></div>
    <div><b>プロのおすすめ</b><p>金色の「推奨」マークの牌・ボタンがプロの判断。牌に指を置く（パソコンはマウスを乗せる）と、切った後の向聴数・有効牌・待ちが見られます。</p></div>
    <div><b>危険度</b><p>相手が攻めている時、牌の下に色バー（緑＝安全 → 赤＝危険）。</p></div>
    <div><b>テンパイ中</b><p>手牌の上に待ち牌と残り枚数、フリテンかどうかを表示します。</p></div>
    <div><b>便利な切り替え</b><p>「自動和了」で和了れる時に自動で和了、「鳴きなし」でポン・チーの確認を省略。</p></div>
    <div><b>一時停止</b><p>CPU戦では右上の「一時停止」で持ち時間とCPUを止められます。</p></div>
  </div>
  <p><button class="btn primary" id="closeGuide">閉じる</button></p>`);
  $('closeGuide').onclick=closeOrRestore;
}
// rotating tip
let tipI=Math.floor(Math.random()*TIPS.length);
function rotateTip(){$('tip').innerHTML=TIPS[tipI%TIPS.length];tipI++;}
rotateTip();setInterval(rotateTip,20000);
renderVoiceBtn();
function applyGuide(){document.body.classList.toggle('guide',!!S.guide);for(const k of ['pond0','pond1','pond2','pond3','hand','melds0','melds1','melds2','melds3','compassIn'])if($(k))$(k).__h=null;if(G)render();}
function renderSfxBtn(){const b=$('btnSfx');b.querySelector('.lbl').textContent=S.sfx?'効果音 オン':'効果音 オフ';b.classList.toggle('on',!!S.sfx);b.classList.toggle('off',!S.sfx);}
$('btnSfx').onclick=()=>{S.sfx=!S.sfx;saveS();renderSfxBtn();if(S.sfx){actx();setTimeout(()=>sfx('call'),60);}};
applyGuide();renderSfxBtn();
// boot: deal a sample CPU hand behind the start screen
gate=new Promise(r=>gateOpen=r);newGame(false,true);showStart();
</script>
